<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EnOrden</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#38297b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EnOrden">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Canciones, setlists y agenda del equipo de alabanza de Iglesia Torre Fuerte.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Paleta Iglesia Torre Fuerte: azul marino #38297B, celeste #0B95D4, blanco. En oscuro, sin blanco. */
:root {
  --bg: #f3f5fb; --surface: #ffffff; --surface2: #e9edf7; --text: #1b1838; --muted: #5c5f7c;
  --line: #dce1ee; --accent: #38297b; --accent-text: #ffffff; --chord: #0877b5; --link: #0877b5;
  --danger: #b42318; --ok: #15803d; --radius: 12px; --lyric: 19px;
  --hdr: #38297b; --hdr-text: #ffffff; --hdr-muted: #c9c5ec; --hdr-line: #0b95d4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100d26; --surface: #1b1640; --surface2: #262056; --text: #e3e6f5; --muted: #a2a6c8;
    --line: #322a6a; --accent: #1ea3e2; --accent-text: #0d0a24; --chord: #5cc8f6; --link: #5cc8f6;
    --danger: #ff8a8a; --ok: #5ee0a0; --hdr: #1b1640; --hdr-text: #e3e6f5; --hdr-muted: #a2a6c8; --hdr-line: #322a6a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100d26; --surface: #1b1640; --surface2: #262056; --text: #e3e6f5; --muted: #a2a6c8;
  --line: #322a6a; --accent: #1ea3e2; --accent-text: #0d0a24; --chord: #5cc8f6; --link: #5cc8f6;
  --danger: #ff8a8a; --ok: #5ee0a0; --hdr: #1b1640; --hdr-text: #e3e6f5; --hdr-muted: #a2a6c8; --hdr-line: #322a6a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.2; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* barra de carga */
#bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 50; overflow: hidden; opacity: 0; transition: opacity .2s; }
#bar.on { opacity: 1; }
#bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: var(--accent); animation: slide 1s infinite ease-in-out; }
@keyframes slide { from { left: -40%; } to { left: 100%; } }

/* encabezado */
.top { position: sticky; top: 0; z-index: 10; background: var(--hdr); color: var(--hdr-text); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
html.offline .top-row::after { content: "Sin conexión"; font-size: 12px; background: #b45309; color: #fff; padding: 2px 8px; border-radius: 99px; order: 2; }
.install-bar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 40; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--chord); border-radius: 14px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.25); max-width: 560px; margin: 0 auto; }
.install-bar .logo { width: 40px; height: 40px; }
.install-text { flex: 1; font-size: 14px; }
body:has(.main.live) #install { display: none; }
body:has(.auth) .install-bar { position: static; margin: 0 auto 32px; width: calc(100% - 32px); max-width: 368px; box-shadow: none; }
body:has(.main) .install-bar ~ *, body:has(.install-bar) .main { padding-bottom: 150px; }
body:has(.main .install-bar), body:has(#install .install-bar) #toast { bottom: 120px; }
.top-row { display: flex; align-items: center; gap: 10px; max-width: 820px; margin: 0 auto; padding: 10px 16px 4px; }
.brand { font-weight: 700; flex: 1; letter-spacing: -.01em; order: 1; }
.top-row > .who { order: 3; }
.top-row > .bell { order: 2; }
.who { font-size: 14px; color: var(--hdr-text); max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: transparent; border: 1px solid var(--hdr-muted); border-radius: 99px; padding: 5px 12px; cursor: pointer; }
.who.on { border-color: var(--hdr-line); box-shadow: inset 0 0 0 1px var(--hdr-line); }
.top .logo { box-shadow: 0 0 0 2px var(--hdr-line); }
.logo { width: 34px; height: 34px; border-radius: 50%; display: block; flex: none; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--hdr-muted); background: transparent; color: var(--hdr-text); font-size: 22px; line-height: 1; cursor: pointer; flex: none; }
.tabs { display: flex; gap: 4px; max-width: 820px; margin: 0 auto; padding: 0 12px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 9px 9px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.top .tab { color: var(--hdr-muted); }
@media (max-width: 440px) { .top .tab { padding: 10px 6px 9px; font-size: 15px; } .tabs { padding: 0 8px; gap: 0; } }
.top .tab.on { color: var(--hdr-text); border-bottom: 3px solid var(--hdr-line); }

.main { max-width: 820px; margin: 0 auto; padding: 16px 16px 80px; }

/* controles */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; min-height: 40px; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
label.f { display: block; margin-bottom: 12px; }
label.f > span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
input[type=text], input[type=email], input[type=password], input[type=search], input[type=number], input[type=url], select, textarea {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-height: 42px;
}
input:focus, select:focus, textarea:focus, .btn:focus-visible, .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { resize: vertical; }
.editor { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 15px; line-height: 1.5; min-height: 55vh; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.card h3 { font-size: 16px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

/* listas */
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; cursor: pointer; color: inherit; text-decoration: none; }
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--surface2); }
.item.static { cursor: default; }
.item.static:hover { background: none; }
.item-main { flex: 1; min-width: 0; }
.item-title { font-weight: 600; overflow-wrap: anywhere; }
.item-sub { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.key { font-weight: 700; color: var(--chord); background: var(--surface2); border-radius: 8px; padding: 2px 8px; font-size: 14px; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.badge.accent { background: var(--accent); color: var(--accent-text); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.search { margin-bottom: 12px; }

/* canción */
.song-head { margin-bottom: 12px; }
.song-head h2 { font-size: 24px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.meta { color: var(--muted); margin-top: 4px; }
.notes { background: var(--surface2); border-radius: 10px; padding: 10px 12px; margin: 10px 0; white-space: pre-wrap; font-size: 15px; }
.subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0; overflow-x: auto; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; min-height: 38px; font-size: 17px; }
.seg button:hover { background: var(--surface2); }
.seg .val { padding: 0 8px; font-weight: 700; color: var(--chord); min-width: 64px; text-align: center; font-size: 15px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; cursor: pointer; padding: 0 4px; }

.sheet { font-size: var(--lyric); line-height: 1.35; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px; overflow-wrap: anywhere; }
.sheet .ln { white-space: pre-wrap; min-height: 1.35em; }
.sheet .cl { display: flex; flex-wrap: wrap; align-items: flex-end; margin-top: .25em; }
.sheet .sg { display: inline-flex; flex-direction: column; }
.sheet .ch { color: var(--chord); font-weight: 700; font-size: .85em; padding-right: .45em; white-space: pre; line-height: 1.2; }
.sheet .ly { white-space: pre; }
.sheet .only .ly { display: none; }
.sheet .gap { height: .8em; }
.sheet .sec { font-size: .72em; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 1em 0 .2em; }
.sheet .sec:first-child { margin-top: 0; }

.help { font-size: 14px; color: var(--muted); background: var(--surface2); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.help code { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--text); }
.alert { border: 1px solid var(--danger); color: var(--danger); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.success { border: 1px solid var(--ok); border-radius: 10px; padding: 12px; margin-top: 12px; }
.code { font: 700 24px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; color: var(--chord); }

/* login */
.auth { max-width: 400px; margin: 0 auto; padding: 48px 16px; }
.auth-brand { text-align: center; margin-bottom: 24px; }
.auth-brand .logo { width: 112px; height: 112px; margin: 0 auto 14px; }
.auth-brand h1 { font-size: 32px; }
.name { letter-spacing: -.02em; }
.name-b { color: var(--chord); }
.top .name-b { color: var(--hdr-line); }
.verse { margin: 10px auto 0; max-width: 300px; font-style: italic; color: var(--muted); line-height: 1.4; }
.verse cite { display: block; font-style: normal; font-size: 13px; margin-top: 4px; color: var(--chord); letter-spacing: .03em; }
.church { text-align: center; color: var(--muted); font-size: 14px; margin-top: 28px; }
.church .slogan { color: var(--chord); font-weight: 600; margin-top: 2px; }
.account-verse { text-align: center; margin: 28px 0 0; }
.auth-brand h1 { font-size: 26px; letter-spacing: -.02em; }
.auth .tabs { padding: 0; margin-bottom: 16px; border-bottom: 1px solid var(--line); }

/* modal y aviso */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--radius); padding: 18px; width: 100%; max-width: 460px; max-height: 92vh; overflow: auto; }
.modal.wide { max-width: 900px; height: 92vh; display: flex; flex-direction: column; }
.modal.wide iframe, .modal.wide .viewer { flex: 1; width: 100%; border: 0; border-radius: 8px; background: var(--surface2); min-height: 0; }
.modal.wide .viewer { overflow: auto; display: flex; align-items: center; justify-content: center; }
.modal.wide img { max-width: 100%; max-height: 100%; }
.modal p { margin: 0 0 16px; white-space: pre-wrap; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 70; opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100% - 32px); font-size: 15px; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.loading-row { padding: 24px; text-align: center; color: var(--muted); }
/* novedades, citaciones y chat */
.bell { position: relative; font-size: 17px; }
.bell.on { border-color: var(--hdr-line); }
.nbadge { background: #e5484d; color: #fff; border-radius: 99px; font-size: 11px; font-weight: 700; padding: 1px 6px; line-height: 16px; }
.bell .nbadge { position: absolute; top: -6px; right: -8px; }
.tab .nbadge { margin-left: 4px; }
.nbadge[hidden] { display: none; }
.count { background: var(--chord); color: #fff; border-radius: 99px; font-size: 13px; font-weight: 700; padding: 2px 9px; }
.item.unread { background: var(--surface2); }
.st { font-size: 13px; font-weight: 600; white-space: nowrap; }
.st-ok { color: var(--ok); } .st-no { color: var(--danger); } .st-pend { color: #c26a00; }
:root[data-theme="dark"] .st-pend { color: #f5b04c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .st-pend { color: #f5b04c; } }
.item .st { margin-left: 6px; }
.team-count { font-size: 12px; letter-spacing: .03em; }
.cita { border-width: 2px; }
.cita-pend { border-color: #e09a2b; } .cita-ok { border-color: var(--ok); } .cita-no { border-color: var(--danger); }
.btn.danger.on { background: var(--danger); color: #fff; border-color: var(--danger); }
.main.chat-view { padding-bottom: 150px; }
.chat-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.chat-head h2 { font-size: 20px; flex: 1; overflow-wrap: anywhere; }
.chat-msgs { display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 82%; align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 6px 10px; }
.msg.mine { align-self: flex-end; background: var(--surface2); border-radius: 14px 14px 4px 14px; }
.msg-name { font-size: 13px; font-weight: 700; color: var(--chord); }
.msg-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-meta { font-size: 11px; color: var(--muted); text-align: right; display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.msg-del { border: 0; background: none; cursor: pointer; font-size: 12px; opacity: .6; padding: 0 2px; }
.msg-del:hover { opacity: 1; }
.msg-day { align-self: center; font-size: 12px; color: var(--muted); background: var(--surface2); border-radius: 99px; padding: 2px 10px; margin: 8px 0 2px; }
.chat-img { max-width: 100%; max-height: 260px; border-radius: 10px; display: block; margin: 4px 0; cursor: zoom-in; }
.chat-img-ph { font-size: 13px; color: var(--muted); padding: 6px 0; }
.chat-compose { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
.chat-row { display: flex; gap: 8px; align-items: flex-end; max-width: 820px; margin: 0 auto; }
.chat-row textarea { flex: 1; min-height: 42px; max-height: 140px; resize: none; }
.chat-preview { max-width: 820px; margin: 0 auto 8px; display: flex; align-items: center; gap: 10px; }
.chat-preview img { height: 64px; border-radius: 8px; }
body:has(.chat-view) #install { display: none; }
/* ajustes del músico y diagramas */
.music-sum { display: block; border: 0; background: none; padding: 0; margin: -6px 0 12px; color: var(--chord); font-size: 14px; font-weight: 600; cursor: pointer; text-align: left; }
.music-btn.on { border-color: var(--chord); color: var(--chord); }
.stage-group { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; margin: 0; display: grid; gap: 10px; min-width: 0; }
.stage-group legend { font-weight: 700; font-size: 14px; padding: 0 6px; }
.stage-group[disabled] { opacity: .45; }
.use-mine { align-items: flex-start; gap: 10px; padding: 0; }
.use-mine input { margin-top: 4px; }
.key-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.key-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 0; cursor: pointer; font-weight: 600; min-height: 38px; }
.key-btn.orig { box-shadow: inset 0 0 0 2px var(--chord); }
.key-btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.sheet .ch.tap { cursor: pointer; border-radius: 4px; }
.sheet .ch.tap:hover, .sheet .ch.tap:focus-visible { background: var(--surface2); outline: none; }
.dg-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.dg-grid + .sheet, .sheet + .dg-grid { margin-top: 12px; }
.dg-sticky { position: sticky; top: 92px; z-index: 5; max-height: 40vh; overflow: auto; flex-wrap: nowrap; }
html.stage .dg-sticky { top: 0; }
.dg { margin: 0; text-align: center; flex: none; width: calc(84px * var(--dg, 1)); }
.dg.dg-wide { width: calc(150px * var(--dg, 1)); }
.dg-name { font-weight: 700; color: var(--chord); font-size: calc(15px * var(--dg, 1)); }
.dg-svg { width: 100%; height: auto; display: block; }
.dg-note { font-size: 12px; color: var(--muted); }
.dg-line { stroke: var(--muted); stroke-width: 1.2; }
.dg-fill { fill: var(--text); }
.dg-dot { fill: var(--chord); }
.dg-bass { fill: var(--accent); stroke: var(--chord); stroke-width: 2; }
.dg-open { fill: none; stroke: var(--chord); stroke-width: 1.6; }
.dg-small { font-size: 11px; fill: var(--muted); }
.dg-key { fill: #fff; stroke: #9aa0b5; }
.dg-key-on { fill: var(--chord); stroke: #9aa0b5; }
.dg-key-bass { fill: var(--accent); stroke: #9aa0b5; }
.dg-bkey { fill: #1b1838; }
.dg-bkey-on { fill: var(--chord); stroke: #1b1838; }
.dg-bkey-bass { fill: var(--accent); stroke: #1b1838; }
@media (max-width: 420px) { .key-grid { grid-template-columns: repeat(4, 1fr); } }
.kv { display: grid; grid-template-columns: minmax(9em, 40%) 1fr; gap: 6px 12px; margin: 0 0 10px; font-size: 15px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.meter { height: 10px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin: 4px 0 12px; }
.meter-fill { height: 100%; background: var(--chord); border-radius: 99px; }
.meter.high .meter-fill { background: var(--danger); }
.meter-label { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--surface2); border-radius: 10px; padding: 10px 12px; }
.stat-n { font-size: 24px; font-weight: 700; color: var(--accent); line-height: 1.1; }
:root[data-theme="dark"] .stat-n { color: var(--chord); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat-n { color: var(--chord); } }
.stat-l { font-size: 13px; color: var(--muted); }
.filters { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; margin-bottom: 4px; }
@media (max-width: 600px) { .filters { grid-template-columns: 1fr 1fr; } .filters input { grid-column: 1 / -1; } }
.reg { align-items: flex-start; }
.reg-icon { width: 24px; text-align: center; flex: none; }
.reg-time { font-size: 13px; color: var(--muted); white-space: nowrap; }
a { color: var(--link); }
.section-title { font-size: 15px; margin: 20px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.section-title:first-child { margin-top: 0; }
.grid3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 0 12px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: 1fr 1fr; } .grid3 > :first-child { grid-column: 1 / -1; } }
.datebox { width: 46px; flex: none; text-align: center; border-radius: 10px; background: var(--surface2); padding: 4px 0; color: var(--accent); }
:root[data-theme="dark"] .datebox { color: var(--chord); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .datebox { color: var(--chord); } }
.datebox-d { font-size: 20px; font-weight: 700; line-height: 1.1; }
.datebox-m { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.num { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.item-note { font-size: 14px; color: var(--chord); margin-top: 2px; }
.item.me { background: var(--surface2); }
.list.mine { border-color: var(--chord); }
.team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
@media (max-width: 520px) { .team-grid { grid-template-columns: 1fr; } }
.team-row { display: grid; grid-template-columns: 9.5em 1fr; align-items: center; gap: 8px; font-size: 15px; }
.sl-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; background: var(--bg); }
.aviso-body { white-space: pre-wrap; margin-top: 8px; overflow-wrap: anywhere; }
.aviso.pinned { border-color: var(--chord); }
.main.live { padding-bottom: 110px; max-width: none; }
html.stage .main.live { padding-top: calc(8px + env(safe-area-inset-top)); }
.stage-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.stage-bar .icon-btn { border-color: var(--line); color: var(--text); background: var(--surface); }
.stage-bar .icon-btn.on { border-color: var(--chord); color: var(--chord); }
.stage-title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; border: 0; background: none; text-align: left; cursor: pointer; padding: 0; color: var(--text); }
.stage-count { font-size: 14px; color: var(--muted); flex: none; }
.stage-name { font-size: 22px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage-key { flex: none; font-size: 15px; }
.stage-note { margin: 0 0 10px; }
.stage-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; display: grid; gap: 12px; }
.stage-opt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.stage-opt > .muted { min-width: 9em; }
.pills { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: 15px; min-height: 36px; }
.pill.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.sheet .blk { break-inside: avoid; }
.sheet.mode-chords .cl.only .sg { margin-right: .6em; }
.sheet.mode-chords .ch { font-size: 1em; }
.live .sheet.cols-2 { column-count: 2; column-gap: 40px; column-rule: 1px solid var(--line); }
@media (orientation: landscape) and (min-width: 900px) {
  .live .sheet.cols-auto { column-count: 2; column-gap: 40px; column-rule: 1px solid var(--line); }
}
@media (min-width: 900px) { .main.live { padding-left: 28px; padding-right: 28px; } }
.live-head h2 { font-size: 26px; overflow-wrap: anywhere; }
.live-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 10px; align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); }
.live-nav .btn { min-height: 48px; }
.live-next { flex: 1; text-align: center; font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>

<div id="install"></div>
<script src="config.js"></script>

<script>
//<chords>
/* Acordes: lectura, transposición y conversión. Sin dependencias del navegador. */
var Chords = (function () {
  var SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  var FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  var L_SHARP = ['Do', 'Do#', 'Re', 'Re#', 'Mi', 'Fa', 'Fa#', 'Sol', 'Sol#', 'La', 'La#', 'Si'];
  var L_FLAT = ['Do', 'Reb', 'Re', 'Mib', 'Mi', 'Fa', 'Solb', 'Sol', 'Lab', 'La', 'Sib', 'Si'];
  var BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11, DO: 0, RE: 2, MI: 4, FA: 5, SOL: 7, LA: 9, SI: 11 };
  var ROOT = '(?:Do|DO|Re|RE|Mi|MI|Fa|FA|Sol|SOL|La|LA|Si|SI|[A-G])(?:#|b)?';
  var QUAL = '(?:maj|min|m|M|dim|aug|sus|add|º|°|ø|\\+|-|[0-9]|\\(|\\)|#|b)*';
  var CHORD_RE = new RegExp('^(' + ROOT + ')(' + QUAL + ')(?:/(' + ROOT + '))?$');
  var FLAT_MAJOR = { 1: 1, 3: 1, 5: 1, 8: 1, 10: 1 }; // Db Eb F Ab Bb
  var FILLER = /^(\||\/|-+|x\d+|\(x\d+\)|%|\.+)$/i;

  function parse(s) {
    var m = CHORD_RE.exec(String(s || '').trim());
    return m ? { root: m[1], qual: m[2], bass: m[3] || '' } : null;
  }
  function isChord(s) { return !!parse(s); }
  function mod(n) { return ((n % 12) + 12) % 12; }
  function noteIdx(root) {
    var base = root.replace(/[#b]$/, '');
    var acc = root.slice(base.length);
    return mod(BASE[base.toUpperCase()] + (acc === '#' ? 1 : acc === 'b' ? -1 : 0));
  }
  function styleOf(root) {
    var b = root.replace(/[#b]$/, '');
    if (b.length === 1) return 'en';
    return b === b.toUpperCase() ? 'LATIN' : 'latin';
  }
  function name(idx, flat, style) {
    idx = mod(idx);
    if (style === 'en') return (flat ? FLAT : SHARP)[idx];
    var n = (flat ? L_FLAT : L_SHARP)[idx];
    if (style === 'LATIN') { var b = n.replace(/[#b]$/, ''); return b.toUpperCase() + n.slice(b.length); }
    return n;
  }
  function isMinor(qual) { return /^(m(?!aj)|min|-)/.test(qual); }
  function prefersFlat(idx, minor) { return !!FLAT_MAJOR[mod(minor ? idx + 3 : idx)]; }

  function transposeChord(ch, semis, flat) {
    if (!mod(semis)) return ch;
    var p = parse(ch);
    if (!p) return ch;
    var out = name(noteIdx(p.root) + semis, flat, styleOf(p.root)) + p.qual;
    if (p.bass) out += '/' + name(noteIdx(p.bass) + semis, flat, styleOf(p.bass));
    return out;
  }

  /** Tonalidad destino: { name, flat }. null si la tonalidad no se reconoce. */
  function targetKey(key, semis) {
    var p = parse(key);
    if (!p) return null;
    var idx = mod(noteIdx(p.root) + semis);
    var flat = prefersFlat(idx, isMinor(p.qual));
    if (!mod(semis)) flat = /b$/.test(p.root) || (!/#$/.test(p.root) && flat);
    return { name: mod(semis) ? name(idx, flat, styleOf(p.root)) + p.qual : key.trim(), flat: flat };
  }

  function detectKey(text) {
    var re = /\[([^\]]*)\]/g, m;
    while ((m = re.exec(text || ''))) if (isChord(m[1])) return m[1].trim();
    return '';
  }

  /** Divide una línea en: sección, texto o segmentos {chord, text}. */
  function parseLine(line) {
    var t = line.trim();
    var sec = /^\[([^\]]+)\]$/.exec(t);
    if (sec && !isChord(sec[1])) return { type: 'section', text: sec[1].trim() };
    var segs = [], re = /\[([^\]]*)\]/g, last = 0, m, cur = { chord: null, text: '' }, has = false;
    while ((m = re.exec(line))) {
      if (!isChord(m[1])) continue;
      cur.text += line.slice(last, m.index);
      if (cur.chord !== null || cur.text) segs.push(cur);
      cur = { chord: m[1].trim(), text: '' };
      last = re.lastIndex;
      has = true;
    }
    cur.text += line.slice(last);
    if (cur.chord !== null || cur.text) segs.push(cur);
    return has ? { type: 'chords', segs: segs } : { type: 'text', text: line };
  }

  function transposeText(text, semis, flat) {
    return String(text).replace(/\[([^\]]*)\]/g, function (all, inner) {
      return isChord(inner) ? '[' + transposeChord(inner.trim(), semis, flat) + ']' : all;
    });
  }

  /** Letra sin acordes ni títulos de sección, estrofas separadas por una línea en blanco. */
  function plainLyrics(text) {
    var out = [];
    String(text).replace(/\r/g, '').split('\n').forEach(function (line) {
      var p = parseLine(line);
      if (p.type === 'section') { out.push(''); return; }
      if (p.type === 'chords') {
        var s = p.segs.map(function (x) { return x.text; }).join('').replace(/\s+/g, ' ').trim();
        if (s) out.push(s);
        return;
      }
      out.push(line.trim());
    });
    return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  function tokens(line) {
    var r = [], re = /\S+/g, m;
    while ((m = re.exec(line))) r.push({ t: m[0], i: m.index });
    return r;
  }
  function isChordLine(line) {
    var tk = tokens(line), n = 0;
    if (!tk.length) return false;
    for (var k = 0; k < tk.length; k++) {
      if (isChord(tk[k].t)) n++;
      else if (!FILLER.test(tk[k].t)) return false;
    }
    return n > 0;
  }

  /** Convierte el formato "acordes en la línea de arriba" (LaCuerda, Cifraclub) a [G]acordes en línea. */
  function convertChordsAbove(text) {
    var lines = String(text).replace(/\r/g, '').replace(/\t/g, '    ').split('\n'), out = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      // "Intro: G C D" → "Intro: [G] [C] [D]"
      var lab = /^(\s*[^\s\[\]:][^\[\]:]{0,24}:\s*)(.+)$/.exec(line);
      if (lab && !isChordLine(line) && isChordLine(lab[2])) {
        out.push(lab[1] + lab[2].replace(/\S+/g, function (t) { return isChord(t) ? '[' + t + ']' : t; }));
        continue;
      }
      if (!isChordLine(line)) { out.push(line); continue; }
      var chords = tokens(line).filter(function (x) { return isChord(x.t); });
      var next = lines[i + 1];
      if (next !== undefined && next.trim() && !isChordLine(next) && !/:\s*$/.test(next)) {
        var s = next;
        for (var k = chords.length - 1; k >= 0; k--) {
          var c = chords[k];
          if (s.length < c.i) s += new Array(c.i - s.length + 1).join(' ');
          s = s.slice(0, c.i) + '[' + c.t + ']' + s.slice(c.i);
        }
        out.push(s.replace(/\s+$/, ''));
        i++;
      } else {
        out.push(chords.map(function (c) { return '[' + c.t + ']'; }).join(' '));
      }
    }
    return out.join('\n');
  }

  // ---------- Calidad del acorde, notas y diagramas ----------
  var INTERVALS = {
    '': [0, 4, 7], m: [0, 3, 7], 7: [0, 4, 7, 10], m7: [0, 3, 7, 10], maj7: [0, 4, 7, 11],
    sus4: [0, 5, 7], sus2: [0, 2, 7], '7sus4': [0, 5, 7, 10], dim: [0, 3, 6], m7b5: [0, 3, 6, 10],
    dim7: [0, 3, 6, 9], aug: [0, 4, 8], add9: [0, 4, 7, 14], madd9: [0, 3, 7, 14], 6: [0, 4, 7, 9],
    m6: [0, 3, 7, 9], 9: [0, 4, 7, 10, 14], m9: [0, 3, 7, 10, 14], maj9: [0, 4, 7, 11, 14],
  };
  var QUAL_RULES = [
    [/^(|M|5)$/, ''], [/^(m|min|-)$/, 'm'], [/^7$/, '7'], [/^(m7|min7|-7)$/, 'm7'],
    [/^(maj7|M7|7M|Δ|Δ7)$/, 'maj7'], [/^(maj9|M9)$/, 'maj9'], [/^(sus|sus4|4)$/, 'sus4'], [/^(sus2|2)$/, 'sus2'],
    [/^7sus4?$/, '7sus4'], [/^(dim|º|°|o)$/, 'dim'], [/^(dim7|º7|°7|o7)$/, 'dim7'],
    [/^(m7b5|m7-5|ø|ø7)$/, 'm7b5'], [/^(aug|\+|\+5|#5)$/, 'aug'], [/^(add9|add2)$/, 'add9'],
    [/^(madd9|madd2|m2)$/, 'madd9'], [/^(9|79)$/, '9'], [/^(m9|min9|m79)$/, 'm9'], [/^6$/, '6'], [/^(m6|min6)$/, 'm6'],
  ];
  /** Calidad normalizada (clave de INTERVALS). approx = true si se aproximó. */
  function quality(qual) {
    var q = String(qual || '').replace(/[()\s]/g, '');
    for (var i = 0; i < QUAL_RULES.length; i++) if (QUAL_RULES[i][0].test(q)) return { q: QUAL_RULES[i][1], approx: false };
    var minor = /^(m(?!aj)|min|-)/.test(q);
    var seven = /7/.test(q);
    if (/^maj/.test(q)) return { q: 'maj7', approx: true };
    return { q: minor ? (seven ? 'm7' : 'm') : (seven ? '7' : ''), approx: true };
  }
  /** Datos de un acorde: raíz, calidad, notas (0–11) y nota del bajo. */
  function info(ch) {
    var p = parse(ch);
    if (!p) return null;
    var root = noteIdx(p.root), qu = quality(p.qual);
    var iv = INTERVALS[qu.q];
    return {
      name: String(ch).trim(), root: root, q: qu.q, approx: qu.approx, intervals: iv,
      notes: iv.map(function (i) { return mod(root + i); }),
      bass: p.bass ? noteIdx(p.bass) : root, slash: !!p.bass,
    };
  }
  /** Simplifica a mayor o menor (sin séptimas ni bajos). */
  function simplify(ch) {
    var p = parse(ch);
    if (!p) return ch;
    var q = quality(p.qual).q;
    var minor = ['m', 'm7', 'm6', 'm9', 'madd9', 'm7b5', 'dim', 'dim7'].indexOf(q) >= 0;
    return p.root + (minor ? 'm' : '');
  }
  function simplifyText(text) {
    return String(text).replace(/\[([^\]]*)\]/g, function (all, inner) { return isChord(inner) ? '[' + simplify(inner.trim()) + ']' : all; });
  }

  // Guitarra: posiciones abiertas conocidas (de la 6.ª a la 1.ª cuerda; -1 = no se toca)
  var OPEN = {
    'C': [-1, 3, 2, 0, 1, 0], 'C7': [-1, 3, 2, 3, 1, 0], 'Cmaj7': [-1, 3, 2, 0, 0, 0], 'Cadd9': [-1, 3, 2, 0, 3, 0],
    'Csus4': [-1, 3, 3, 0, 1, 1], 'C6': [-1, 3, 2, 2, 1, 0],
    'D': [-1, -1, 0, 2, 3, 2], 'Dm': [-1, -1, 0, 2, 3, 1], 'D7': [-1, -1, 0, 2, 1, 2], 'Dmaj7': [-1, -1, 0, 2, 2, 2],
    'Dm7': [-1, -1, 0, 2, 1, 1], 'Dsus4': [-1, -1, 0, 2, 3, 3], 'Dsus2': [-1, -1, 0, 2, 3, 0], 'D6': [-1, -1, 0, 2, 0, 2],
    'E': [0, 2, 2, 1, 0, 0], 'Em': [0, 2, 2, 0, 0, 0], 'E7': [0, 2, 0, 1, 0, 0], 'Em7': [0, 2, 0, 0, 0, 0],
    'Emaj7': [0, 2, 1, 1, 0, 0], 'Esus4': [0, 2, 2, 2, 0, 0], 'Eadd9': [0, 2, 2, 1, 0, 2],
    'G': [3, 2, 0, 0, 0, 3], 'G7': [3, 2, 0, 0, 0, 1], 'Gmaj7': [3, 2, 0, 0, 0, 2], 'G6': [3, 2, 0, 0, 0, 0],
    'Gsus4': [3, 3, 0, 0, 1, 3], 'Gadd9': [3, 0, 0, 2, 0, 3],
    'A': [-1, 0, 2, 2, 2, 0], 'Am': [-1, 0, 2, 2, 1, 0], 'A7': [-1, 0, 2, 0, 2, 0], 'Am7': [-1, 0, 2, 0, 1, 0],
    'Amaj7': [-1, 0, 2, 1, 2, 0], 'Asus4': [-1, 0, 2, 2, 3, 0], 'Asus2': [-1, 0, 2, 2, 0, 0], 'Aadd9': [-1, 0, 2, 4, 2, 0],
    'Fmaj7': [-1, -1, 3, 2, 1, 0], 'B7': [-1, 2, 1, 2, 0, 2],
    'D/F#': [2, -1, 0, 2, 3, 2], 'G/B': [-1, 2, 0, 0, 0, 3], 'C/E': [0, 3, 2, 0, 1, 0], 'C/G': [3, 3, 2, 0, 1, 0],
    'Am/G': [3, 0, 2, 2, 1, 0], 'A/C#': [-1, 4, 2, 2, 2, 0], 'D/A': [-1, 0, 0, 2, 3, 2], 'G/D': [-1, -1, 0, 0, 0, 3],
    'F/C': [-1, 3, 3, 2, 1, 1], 'E/G#': [4, 2, 2, 1, 0, 0], 'Em/D': [-1, -1, 0, 0, 0, 0], 'C/B': [-1, 2, 2, 0, 1, 0],
  };
  // Formas móviles: raíz en la 6.ª cuerda (forma de E) o en la 5.ª (forma de A)
  var SHAPE_E = {
    '': [0, 2, 2, 1, 0, 0], m: [0, 2, 2, 0, 0, 0], 7: [0, 2, 0, 1, 0, 0], m7: [0, 2, 0, 0, 0, 0], maj7: [0, 2, 1, 1, 0, 0],
    sus4: [0, 2, 2, 2, 0, 0], '7sus4': [0, 2, 0, 2, 0, 0], 6: [0, 2, 2, 1, 2, 0], m6: [0, 2, 2, 0, 2, 0],
    9: [0, 2, 0, 1, 0, 2], aug: [0, 3, 2, 1, 1, 0],
  };
  var SHAPE_A = {
    '': [-1, 0, 2, 2, 2, 0], m: [-1, 0, 2, 2, 1, 0], 7: [-1, 0, 2, 0, 2, 0], m7: [-1, 0, 2, 0, 1, 0], maj7: [-1, 0, 2, 1, 2, 0],
    sus4: [-1, 0, 2, 2, 3, 0], sus2: [-1, 0, 2, 2, 0, 0], '7sus4': [-1, 0, 2, 0, 3, 0], 6: [-1, 0, 2, 2, 2, 2],
    m6: [-1, 0, 2, 2, 1, 2], add9: [-1, 0, 2, 4, 2, 0], madd9: [-1, 0, 2, 4, 1, 0], 9: [-1, 0, 2, 4, 2, 3],
    m9: [-1, 0, 2, 0, 1, 3], maj9: [-1, 0, 2, 1, 0, 0], dim: [-1, 0, 1, 2, 1, -1], m7b5: [-1, 0, 1, 0, 1, -1],
    dim7: [-1, 0, 1, 2, 1, 2], aug: [-1, 0, 3, 2, 2, 1],
  };
  var SHARP_NAME = SHARP;
  function openKey(ch) {
    var p = parse(ch);
    if (!p) return null;
    // Nombre en cifrado americano con sostenidos o bemoles tal cual, para buscar en OPEN
    var root = (p.root.length > 2 || /^(Do|Re|Mi|Fa|Sol|La|Si)/i.test(p.root)) ? SHARP_NAME[noteIdx(p.root)] : p.root;
    var q = quality(p.qual).q;
    var bass = p.bass ? '/' + ((p.bass.length > 2 || /^(Do|Re|Mi|Fa|Sol|La|Si)/i.test(p.bass)) ? SHARP_NAME[noteIdx(p.bass)] : p.bass) : '';
    return root + q + bass;
  }
  /**
   * Diagrama de guitarra: { frets: [6.ª … 1.ª] (-1 no se toca, 0 al aire), base: primer traste mostrado,
   * barre: { fret, from, to } | null }
   */
  function guitar(ch) {
    var inf = info(ch);
    if (!inf) return null;
    var key = openKey(ch);
    var frets = OPEN[key] || (inf.slash ? OPEN[key.split('/')[0]] : null), barre = null;
    if (!frets) {
      var cands = [];
      var fE = mod(inf.root - 4), fA = mod(inf.root - 9);
      if (SHAPE_E[inf.q]) cands.push({ t: SHAPE_E[inf.q], f: fE });
      if (SHAPE_A[inf.q]) cands.push({ t: SHAPE_A[inf.q], f: fA });
      if (!cands.length) cands.push({ t: SHAPE_A[''], f: fA });
      cands.sort(function (a, b) { return a.f - b.f; });
      var c = cands[0];
      frets = c.t.map(function (v) { return v < 0 ? -1 : v + c.f; });
      if (c.f > 0) {
        var from = c.t.indexOf(0), to = c.t.lastIndexOf(0);
        if (to > from) barre = { fret: c.f, from: from, to: 5 };
      }
    }
    var played = frets.filter(function (v) { return v > 0; });
    var max = played.length ? Math.max.apply(null, played) : 0;
    var min = played.length ? Math.min.apply(null, played) : 0;
    var base = max <= 4 ? 1 : min;
    return { name: inf.name, frets: frets.slice(), base: base, barre: barre };
  }
  /** Bajo de 4 cuerdas (E A D G): posiciones cerca de la nota del bajo. */
  function bass(ch) {
    var inf = info(ch);
    if (!inf) return null;
    var open = [4, 9, 2, 7];
    var fE = mod(inf.bass - 4), fA = mod(inf.bass - 9);
    var s0 = fE <= fA || fE <= 4 ? 0 : 1;
    var f0 = s0 === 0 ? fE : fA;
    var lo = Math.max(0, f0 - 1), hi = lo + 4;
    var pos = [{ s: s0, f: f0, kind: 'bass' }];
    for (var s = s0 + 1; s < 4; s++) {
      for (var f = lo; f <= hi; f++) {
        var n = mod(open[s] + f);
        if (inf.notes.indexOf(n) >= 0) pos.push({ s: s, f: f, kind: n === inf.root ? 'root' : 'tone' });
      }
    }
    return { name: inf.name, start: lo, end: hi, positions: pos, bassNote: SHARP[inf.bass] };
  }
  /** Teclado de 2 octavas desde Do: teclas (0–23) a marcar. */
  function keyboard(ch) {
    var inf = info(ch);
    if (!inf) return null;
    var r = inf.root, keys = [];
    var bassKey = null;
    if (inf.slash) { bassKey = inf.bass; if (r <= bassKey) r += 12; }
    inf.intervals.forEach(function (i) { var k = r + i; while (k > 23) k -= 12; keys.push(k); });
    return { name: inf.name, keys: keys, bass: bassKey, root: r };
  }

  return {
    semitones: function (a, b) {
      var pa = parse(a), pb = parse(b);
      return pa && pb ? mod(noteIdx(pb.root) - noteIdx(pa.root)) : 0;
    },

  function brandName() { return el('span', { class: 'name' }, 'En', el('span', { class: 'name-b' }, 'Orden')); }

  }

  var S = { token: store.get('io_token'), user: null, songs: null, cache: {}, setlistCache: {}, stack: [], cur: null, rid: 0, pending: 0, guard: null, loginMode: 'login' };
  var prefs = {
    chords: store.get('io_chords') !== 'no',

  };

  function level() { return S.user ? ROLE_LEVEL[S.user.rol] || 0 : 0; }
  function isAdmin() { return level() >= 2; }
  function isSuper() { return level() >= 3; }
  function setToken(t) { S.token = t; store.set('io_token', t); }

  function applyTheme() {
    if (prefs.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', prefs.theme);
  }

  // ---------- DOM ----------
  function el(tag, attrs) {
    var n = document.createElement(tag);
    for (var i = 2; i < arguments.length; i++) add(n, arguments[i]);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'value') n.value = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    });
    return n;
  }
  function add(n, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(n, x); }); return; }
    n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  }
  function field(label, input) { return el('label', { class: 'f' }, el('span', null, label), input); }
  function loadingRow() { return el('div', { class: 'loading-row' }, 'Cargando…'); }

  function fmtDate(iso, withTime) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    var o = { day: '2-digit', month: '2-digit', year: 'numeric' };
    if (withTime !== false) { o.hour = '2-digit'; o.minute = '2-digit'; }
    return d.toLocaleString('es-AR', o);
  }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 3800);
  }
  function showErr(e) { toast((e && e.message) || 'Ocurrió un error.'); }

  function modal(content, wide) {
    var box = el('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true' }, content);
    var bg = el('div', { class: 'modal-bg' }, box);
    function close() { if (bg.parentNode) bg.parentNode.removeChild(bg); document.removeEventListener('keydown', onKey); }
    function onKey(ev) { if (ev.key === 'Escape') close(); }
    bg.addEventListener('click', function (ev) { if (ev.target === bg) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(bg);
    return close;
  }
  function ask(msg, okLabel, danger) {
    return new Promise(function (resolve) {
      var close;
      var ok = el('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), onclick: function () { close(); resolve(true); } }, okLabel || 'Aceptar');
      close = modal([
        el('p', null, msg),
        el('div', { class: 'row' }, el('span', { class: 'spacer' }),
          el('button', { class: 'btn', onclick: function () { close(); resolve(false); } }, 'Cancelar'), ok),
      ]);
      ok.focus();
    });
  }

  function copyText(text, okMsg) {
    function fallback() {
      var ta = el('textarea', { value: text, readonly: true, style: 'position:fixed;top:0;left:0;opacity:0' });
      document.body.appendChild(ta);
      ta.select();
      var done = false;
      try { done = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (done) { toast(okMsg || 'Copiado.'); return; }
      var area = el('textarea', { value: text, rows: 10, readonly: true });
      var close = modal([el('p', null, 'Seleccioná el texto y copialo:'), area,
        el('div', { class: 'row', style: 'margin-top:12px' }, el('span', { class: 'spacer' }),
          el('button', { class: 'btn primary', onclick: function () { close(); } }, 'Listo'))]);
      area.focus(); area.select();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg || 'Copiado.'); }, fallback);
    } else fallback();
  }

  // ---------- API ----------
  function setBusy(d) {
    S.pending = Math.max(0, S.pending + d);
    document.getElementById('bar').classList.toggle('on', S.pending > 0);
  }
  function call(action, payload) {
    var body = JSON.stringify({ action: action, token: S.token, payload: payload || {} });
    setBusy(1);
    var p;
    if (window.google && google.script && google.script.run) {
      p = new Promise(function (res, rej) {
        google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(body);
      }).then(function (s) { return JSON.parse(s); });
    } else if (!/^https?:\/\//.test(window.API_URL || '')) {
      p = Promise.resolve({ ok: false, error: 'config', message: 'Falta configurar la dirección del servidor en config.js.' });
    } else {
      p = fetch(window.API_URL, { method: 'POST', body: body }).then(function (r) { return r.json(); });
    }
    var key = OFFLINE_READS[action] ? 'io_c:' + action + ':' + JSON.stringify(payload || {}) : null;
    return p.catch(function () {
      return { ok: false, error: 'red', message: 'Sin conexión. Revisá tu internet e intentá de nuevo.' };
    }).then(function (r) {
      setBusy(-1);
      if (r.ok) {
        setOffline(false);
        if (key) store.set(key, JSON.stringify(r.data));
        return r.data;
      }
      if (r.error === 'red' && key) {
        var saved = store.get(key);
        if (saved) { setOffline(true); return JSON.parse(saved); }
      }
      if (r.error === 'sesion' && action.indexOf('auth.') !== 0) { endSession(); }
      throw r;
    });
  }
  // Lo que se puede ver sin conexión (lo último que se cargó en este dispositivo)
  var OFFLINE_READS = { 'auth.me': 1, 'songs.list': 1, 'songs.get': 1, 'setlists.list': 1, 'setlists.get': 1, 'eventos.list': 1,
    'avisos.list': 1, 'eventos.get': 1, 'chat.resumen': 1 };
  function cachedOf(action, payload) {
    try { var v = store.get('io_c:' + action + ':' + JSON.stringify(payload || {})); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  }
  /** Muestra al instante lo guardado en el dispositivo y después actualiza con lo del servidor (si cambió). */
  function live(action, payload, cb, alive) {
    var had = cachedOf(action, payload);
    if (had) cb(had, true);
    if (S.booting && had) return Promise.resolve(had);
    return call(action, payload).then(function (d) {
      if (alive && !alive()) return d;
      if (!had || JSON.stringify(d) !== JSON.stringify(had)) cb(d, false);
      return d;
    }, function (e) { if (!had) throw e; return had; });
  }
  function setOffline(on) {
    if (S.offline === on) return;
    S.offline = on;
    document.documentElement.classList.toggle('offline', on);
    if (on) toast('Sin conexión: estás viendo lo último guardado en este dispositivo.');
  }
  function clearOfflineData() {
    try {
      Object.keys(localStorage).forEach(function (k) { if (k.indexOf('io_c:') === 0) localStorage.removeItem(k); });
    } catch (e) {}
  }
  function endSession() { clearOfflineData(); P.data = {}; P.dirty = {}; prefsLocal(); S.nov = null; setToken(null); S.user = null; S.songs = null; S.cache = {}; S.setlistCache = {}; S.stack = []; S.guard = null; render(); }

  // ---------- Navegación ----------
  var GROUP = {

  };
  function leave(fn) {
    var msg = S.guard && S.guard();
    if (!msg) { S.guard = null; fn(); return; }
    ask(msg, 'Salir sin guardar', true).then(function (ok) { if (ok) { S.guard = null; fn(); } });
  }
  function go(view, params) { leave(function () { if (S.cur) S.stack.push(S.cur); S.cur = { view: view, params: params || {} }; render(); }); }
  function nav(view, params) { leave(function () { S.stack = []; S.cur = { view: view, params: params || {} }; render(); }); }
  function back() { leave(function () { S.cur = S.stack.pop() || { view: 'agenda', params: {} }; render(); }); }
  function replace(view, params) { S.guard = null; S.cur = { view: view, params: params || {} }; render(); }

  function render() {
    var app = document.getElementById('app');
    app.textContent = '';
    var rid = ++S.rid;
    S.guard = null;
    if (!S.user) { app.appendChild(viewLogin()); return; }
    if (!S.cur) S.cur = { view: 'agenda', params: {} };
    var stage = S.cur.view === 'live';
    document.documentElement.classList.toggle('stage', stage);
    if (!stage) { wakeOff(); exitFull(); }
    if (!stage) app.appendChild(header());
    var main = el('main', { class: 'main' });
    app.appendChild(main);
    var v = VIEWS[S.cur.view] || VIEWS.agenda;
    v(main, S.cur.params, function () { return rid === S.rid; });
    window.scrollTo(0, 0);
    var on = app.querySelector('.top .tab.on');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function header() {
    var g = GROUP[S.cur.view] || 'songs';

  // ---------- Letra ----------

        return;

          return el('span', { class: 'sg' }, chordEl(chordName(s.chord)));
        })));
        return;

      var row = el('div', { class: 'cl' + (chordOnly ? ' only' : '') });

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function localDate(iso) { var d = new Date(iso); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function localTime(iso) { var d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function toIso(date, time) { return date ? new Date(date + 'T' + (time || '12:00')).toISOString() : ''; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function fmtDay(iso, long) {
    if (!iso) return '';
    return cap(new Date(iso).toLocaleDateString('es-AR', long === false
      ? { weekday: 'short', day: 'numeric', month: 'short' }

  }
  function fmtTime(iso) { return iso ? localTime(iso) : ''; }

  VIEWS.agenda = function (main, p, alive) {

      case 'adjunto.quitar': return 'quitó el archivo ' + q(d);

      case 'setlist.editar': return 'editó el setlist ' + q(d);

    S.nov = n;
    var b = document.getElementById('nov-bell'), c = document.getElementById('nov-chat');
    if (b) { b.textContent = n.notificaciones > 99 ? '99+' : String(n.notificaciones || ''); b.hidden = !n.notificaciones; }
    if (c) { c.textContent = n.chat > 99 ? '99+' : String(n.chat || ''); c.hidden = !n.chat; }
  }
  function refreshNov() {
    if (!S.user || S.offline || document.visibilityState !== 'visible') return;
    call('app.novedades').then(setNov).catch(function () {});
  }
  setInterval(refreshNov, 60000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refreshNov(); });

  function openLink(link) {
    var m = /^(\w+):?(.*)$/.exec(link || '');
    if (!m) return;
    if (m[1] === 'evento') go('evento', { id: m[2] });
    else if (m[1] === 'setlist') go('setlist', { id: m[2] });
    else if (m[1] === 'cancion') go('song', { id: m[2] });
    else if (m[1] === 'chat') go('chat', { id: m[2] });
    else if (m[1] === 'avisos') nav('avisos');
  }
  var NOTIF_ICON = { aviso: '📢', evento: '📅', cita: '🎟️', setlist: '♫', cancion: '🎵', confirmacion: '✅' };
  function hace(iso) {
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return 'recién';
    if (s < 3600) return 'hace ' + Math.floor(s / 60) + ' min';
    if (s < 86400) return 'hace ' + Math.floor(s / 3600) + ' h';
    if (s < 172800) return 'ayer';
    return fmtDate(iso, false);
  }

  VIEWS.notificaciones = function (main, p, alive) {
    main.appendChild(el('h2', { style: 'font-size:22px;margin-bottom:12px' }, 'Notificaciones'));
    var list = el('div', null, loadingRow());
    main.appendChild(list);
    call('notif.list').then(function (r) {
      if (!alive()) return;
      list.textContent = '';
      var chatN = S.nov && S.nov.chat;
      if (chatN) list.appendChild(el('div', { class: 'list', style: 'margin-bottom:12px' },
        el('button', { class: 'item', onclick: function () { nav('chats'); } },
          el('span', { class: 'reg-icon' }, '💬'),
          el('div', { class: 'item-main' }, el('div', { class: 'item-title' }, chatN + (chatN === 1 ? ' mensaje nuevo' : ' mensajes nuevos') + ' en el chat')),
          el('span', { class: 'muted' }, '›'))));
      if (!r.items.length) { list.appendChild(el('div', { class: 'list' }, el('div', { class: 'empty' }, 'No hay novedades en los últimos 30 días.'))); }
      else list.appendChild(el('div', { class: 'list' }, r.items.map(function (n) {
        return el('button', { class: 'item' + (n.nueva ? ' unread' : ''), onclick: function () { openLink(n.link); } },
          el('span', { class: 'reg-icon', 'aria-hidden': 'true' }, NOTIF_ICON[n.tipo] || '•'),
          el('div', { class: 'item-main' },
            el('div', { class: 'item-title' }, n.titulo),
            n.cuerpo ? el('div', { class: 'item-sub' }, n.cuerpo) : null),
          el('span', { class: 'reg-time' }, (n.nueva ? '● ' : '') + hace(n.fecha)));
      })));
      list.appendChild(el('p', { class: 'muted small', style: 'text-align:center' }, 'Se muestran las novedades de los últimos 30 días.'));
      if (r.items.some(function (n) { return n.nueva; })) {
        call('notif.visto').then(function () { setNov(Object.assign({}, S.nov, { notificaciones: 0 })); }).catch(function () {});
      }
    }).catch(showErr);
  };

  // ---------- Chat ----------
  VIEWS.chats = function (main, p, alive) {
    main.appendChild(el('h2', { style: 'font-size:22px;margin-bottom:12px' }, 'Chat'));
    var list = el('div', null, loadingRow());
    main.appendChild(list);
    live('chat.resumen', {}, function (chats) {
      list.textContent = '';
      var general = chats.filter(function (c) { return c.tipo === 'general'; });
      var evs = chats.filter(function (c) { return c.tipo === 'evento'; })
        .sort(function (a, b) { return (b.ultimo ? b.ultimo.fecha : '').localeCompare(a.ultimo ? a.ultimo.fecha : '') || a.inicio.localeCompare(b.inicio); });
      function row(c) {
        return el('button', { class: 'item', onclick: function () { go('chat', { id: c.id, titulo: c.titulo }); } },
          c.tipo === 'general' ? el('div', { class: 'datebox' }, '💬') : dateBlock(c.inicio),
          el('div', { class: 'item-main' },
            el('div', { class: 'item-title' }, c.tipo === 'general' ? 'General (todos)' : c.titulo),
            el('div', { class: 'item-sub' }, c.ultimo ? c.ultimo.nombre + ': ' + c.ultimo.texto : 'Sin mensajes todavía')),
          c.sin_leer ? el('span', { class: 'count' }, c.sin_leer) : el('span', { class: 'reg-time' }, c.ultimo ? hace(c.ultimo.fecha) : ''));
      }
      list.appendChild(el('div', { class: 'list' }, general.map(row)));
      list.appendChild(el('h3', { class: 'section-title' }, 'Chats de los eventos'));
      list.appendChild(evs.length ? el('div', { class: 'list' }, evs.map(row))
        : el('div', { class: 'list' }, el('div', { class: 'empty' }, 'No hay eventos próximos.')));
      list.appendChild(el('p', { class: 'muted small', style: 'text-align:center' },
        'Los mensajes se borran a los 15 días y las fotos a los 7. El chat de un evento se borra con el evento.'));
    }, alive).catch(showErr);
  };

  /** Achica una foto antes de subirla (lado mayor 1600 px, JPEG). */
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.round(w * k); cv.height = Math.round(h * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        var q = 0.82, data = cv.toDataURL('image/jpeg', q);
        while (data.length > 1.3e6 * 1.37 && q > 0.4) { q -= 0.12; data = cv.toDataURL('image/jpeg', q); }
        resolve({ base64: data.split(',')[1], mime: 'image/jpeg', preview: data });
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject({ message: 'No se pudo leer la imagen.' }); };
      img.src = url;
    });
  }
  S.imgCache = {};
  function chatImage(m, holder) {
    function show(src) {
      holder.textContent = '';
      holder.appendChild(el('img', { src: src, alt: 'Foto de ' + m.usuario_nombre, class: 'chat-img', onclick: function () {
        var close = modal([el('div', { class: 'row', style: 'margin-bottom:10px' }, el('strong', { style: 'flex:1' }, m.usuario_nombre + ' · ' + fmtDate(m.fecha)),
          el('button', { class: 'btn sm', onclick: function () { close(); } }, 'Cerrar')),
          el('div', { class: 'viewer' }, el('img', { src: src, alt: '' }))], true);
      } }));
    }
    if (S.imgCache[m.id]) { show(S.imgCache[m.id]); return; }
    holder.appendChild(el('div', { class: 'chat-img-ph' }, 'Cargando foto…'));
    call('chat.image', { id: m.id }).then(function (r) {
      S.imgCache[m.id] = 'data:' + r.mime + ';base64,' + r.base64;
      show(S.imgCache[m.id]);
    }).catch(function () { holder.textContent = ''; holder.appendChild(el('div', { class: 'chat-img-ph' }, '📷 Foto no disponible')); });
  }

  VIEWS.chat = function (main, p, alive) {
    main.classList.add('chat-view');
    var id = p.id || 'general';
    var head = el('div', { class: 'chat-head' }, el('h2', null, p.titulo || (id === 'general' ? 'General' : 'Chat del evento')));
    var msgs = el('div', { class: 'chat-msgs', role: 'log', 'aria-live': 'polite' }, loadingRow());
    var seen = {}, ultimo = '', lastDay = '', timer = null, lastVisto = 0;
    var ta = el('textarea', { rows: 1, maxlength: 2000, placeholder: 'Escribí un mensaje…', 'aria-label': 'Mensaje' });
    var fileIn = el('input', { type: 'file', accept: 'image/*', style: 'display:none' });
    var sendBtn = el('button', { class: 'btn primary', 'aria-label': 'Enviar' }, 'Enviar');
    var photoBtn = el('button', { class: 'btn', 'aria-label': 'Mandar una foto', onclick: function () { fileIn.click(); } }, '📷');
    var pending = null;
    var preview = el('div', { class: 'chat-preview', hidden: true });
    main.appendChild(head);
    main.appendChild(msgs);
    main.appendChild(el('div', { class: 'chat-compose' }, preview, el('div', { class: 'chat-row' }, photoBtn, ta, sendBtn), fileIn));
    if (id !== 'general') head.appendChild(el('button', { class: 'btn sm', onclick: function () { go('evento', { id: id }); } }, 'Ver evento'));

    function atBottom() { return window.innerHeight + window.scrollY >= document.body.scrollHeight - 80; }
    function scrollEnd() { window.scrollTo(0, document.body.scrollHeight); }
    function bubble(m) {
      var mine = m.usuario_id === S.user.id;
      var canDel = mine || isAdmin();
      var img = el('div');
      if (m.imagen === 'si') chatImage(m, img);
      else if (m.imagen === 'vencida') img.appendChild(el('div', { class: 'chat-img-ph' }, '📷 Imagen vencida (las fotos duran 7 días)'));
      var b = el('div', { class: 'msg' + (mine ? ' mine' : ''), 'data-id': m.id },
        mine ? null : el('div', { class: 'msg-name' }, m.usuario_nombre),
        img,
        m.texto ? el('div', { class: 'msg-text' }, m.texto) : null,
        el('div', { class: 'msg-meta' }, fmtTime(m.fecha),
          canDel ? el('button', { class: 'msg-del', 'aria-label': 'Borrar mensaje', onclick: function () {
            ask(mine ? '¿Borrar tu mensaje?' : '¿Borrar el mensaje de ' + m.usuario_nombre + '? Queda anotado en el registro.', 'Borrar', true).then(function (ok) {
              if (ok) call('chat.delete', { id: m.id }).then(function () { b.remove(); }).catch(showErr);
            });
          } }, '🗑') : null));
      return b;
    }
    function addMessages(list) {
      var stick = atBottom() || !ultimo;
      if (msgs.querySelector('.loading-row')) msgs.textContent = '';
      list.forEach(function (m) {
        if (seen[m.id]) return;
        seen[m.id] = 1;
        var day = localDate(m.fecha);
        if (day !== lastDay) { lastDay = day; msgs.appendChild(el('div', { class: 'msg-day' }, dayLabel(m.fecha))); }
        msgs.appendChild(bubble(m));
      });
      if (!msgs.querySelector('.msg')) { if (!msgs.querySelector('.empty')) msgs.appendChild(el('div', { class: 'empty' }, 'Todavía no hay mensajes. ¡Escribí el primero!')); }
      else { var e = msgs.querySelector('.empty'); if (e) e.remove(); }
      if (stick) scrollEnd();
    }
    function markSeen() {
      if (Date.now() - lastVisto < 8000) return;
      lastVisto = Date.now();
      call('chat.visto', { chat_id: id }).then(refreshNov).catch(function () {});
    }
    function poll() {
      if (!alive()) return;
      timer = setTimeout(function () {
        if (!alive()) return;
        if (document.visibilityState !== 'visible' || S.offline) { poll(); return; }
        call('chat.list', { chat_id: id, desde: ultimo }).then(function (r) {
          if (!alive()) return;
          (r.eliminados || []).forEach(function (did) { var n = msgs.querySelector('[data-id="' + did + '"]'); if (n) n.remove(); });
          if (r.mensajes.length) { addMessages(r.mensajes); markSeen(); }
          ultimo = r.ultimo || ultimo;
        }).catch(function () {}).then(poll);
      }, 4000);
    }
    call('chat.list', { chat_id: id }).then(function (r) {
      if (!alive()) return;
      head.firstChild.textContent = r.titulo;
      ultimo = r.ultimo;
      addMessages(r.mensajes);
      markSeen();
      poll();
    }).catch(function (e) { showErr(e); if (e && e.error === 'no_existe' && alive()) back(); });

    function send() {
      var texto = ta.value.trim();
      if (!texto && !pending) return;
      sendBtn.disabled = true;
      var payload = { chat_id: id, texto: texto };
      if (pending) { payload.imagen = pending.base64; payload.mime = pending.mime; }
      call('chat.send', payload).then(function (m) {
        if (pending) S.imgCache[m.id] = pending.preview;
        ta.value = ''; ta.style.height = ''; pending = null; preview.hidden = true; preview.textContent = '';
        addMessages([m]); scrollEnd();
      }).catch(showErr).then(function () { sendBtn.disabled = false; ta.focus(); });
    }
    sendBtn.addEventListener('click', send);
    ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); send(); } });
    ta.addEventListener('input', function () { ta.style.height = ''; ta.style.height = Math.min(140, ta.scrollHeight) + 'px'; });
    fileIn.addEventListener('change', function () {
      var f = fileIn.files[0];
      fileIn.value = '';
      if (!f) return;
      compressImage(f).then(function (r) {
        pending = r;
        preview.textContent = '';
        preview.appendChild(el('img', { src: r.preview, alt: 'Foto a enviar' }));
        preview.appendChild(el('button', { class: 'btn sm', onclick: function () { pending = null; preview.hidden = true; preview.textContent = ''; } }, 'Quitar'));
        preview.hidden = false;
        ta.focus();
      }).catch(showErr);
    });
  };

  // ---------- Mi cuenta ----------
  VIEWS.account = function (main) {
    var nombre = el('input', { type: 'text', required: true, maxlength: 60, value: S.user.nombre });
    var actual = el('input', { type: 'password', required: true, autocomplete: 'current-password' });
    var nueva = el('input', { type: 'password', required: true, autocomplete: 'new-password' });
    var nueva2 = el('input', { type: 'password', required: true, autocomplete: 'new-password' });
    var theme = el('select', { onchange: function () { prefs.theme = theme.value; store.set('io_theme', prefs.theme); applyTheme(); } },
      el('option', { value: 'auto' }, 'Automático (según el dispositivo)'),
      el('option', { value: 'light' }, 'Claro'),
      el('option', { value: 'dark' }, 'Oscuro'));
    theme.value = prefs.theme;

    main.appendChild(el('div', { class: 'card' },
      el('h3', null, S.user.nombre),
      el('div', { class: 'muted' }, S.user.email),
      el('div', { style: 'margin-top:8px' }, el('span', { class: 'badge accent' }, ROLE_NAME[S.user.rol]))));

    main.appendChild(el('form', { class: 'card', onsubmit: function (ev) {
      ev.preventDefault();
      call('auth.updateMe', { nombre: nombre.value }).then(function (u) { S.user = u; toast('Nombre actualizado.'); render(); }).catch(showErr);
    } }, el('h3', null, 'Tu nombre'), el('p', { class: 'muted small', style: 'margin-top:0' }, 'Es el que aparece en el historial de versiones.'),
      field('Nombre', nombre), el('button', { class: 'btn', type: 'submit' }, 'Guardar nombre')));

    main.appendChild(el('form', { class: 'card', onsubmit: function (ev) {
      ev.preventDefault();
      if (nueva.value !== nueva2.value) { toast('Las contraseñas nuevas no coinciden.'); return; }
      call('auth.updateMe', { password_actual: actual.value, password_nuevo: nueva.value }).then(function () {
        actual.value = nueva.value = nueva2.value = '';
        toast('Contraseña cambiada.');
      }).catch(showErr);
    } }, el('h3', null, 'Cambiar contraseña'),
      field('Contraseña actual', actual), field('Nueva (mínimo 8 caracteres)', nueva), field('Repetir la nueva', nueva2),
      el('button', { class: 'btn', type: 'submit' }, 'Cambiar contraseña')));

    main.appendChild(el('div', { class: 'card' }, el('h3', null, 'Apariencia'), field('Tema', theme)));
    var hint = window.EnOrden && window.EnOrden.installHint();
    if (hint) {
      main.appendChild(el('div', { class: 'card' }, el('h3', null, 'Instalar en este dispositivo'),
        el('p', { class: 'muted', style: 'margin-top:0' }, hint.text),
        hint.button ? el('button', { class: 'btn primary', onclick: function () { window.EnOrden.doInstall(); } }, 'Instalar EnOrden') : null));
    }

    main.appendChild(el('button', { class: 'btn danger', onclick: function () {
      (Object.keys(P.dirty).length ? call('prefs.set', { cambios: P.dirty }).catch(function () {}) : Promise.resolve())
        .then(function () { return call('auth.logout').catch(function () {}); }).then(endSession);
    } }, 'Cerrar sesión'));
    main.appendChild(el('div', { class: 'account-verse' }, verse(), el('p', { class: 'muted small' }, 'EnOrden ' + APP_VERSION)));
  };

  // ---------- Inicio ----------
  applyTheme();
  function startHash(cb) {
    if (window.google && google.script && google.script.url) {
      try { google.script.url.getLocation(function (l) { cb(l.hash || ''); }); return; } catch (e) { /* sigue */ }
    }
    cb((location.hash || '').replace(/^#/, ''));
  }
  /** Links de los mails: …#evento=<id> abre ese evento. */
  function openFromHash() {
    startHash(function (h) {
      var m = /evento=([\w-]+)/.exec(h || '');
      if (!m || !S.user) return;
      try { if (!(window.google && google.script) && history.replaceState) history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* nada */ }
      go('evento', { id: m[1] });
    });
  }
  function boot() {
    if (!S.token) { render(); return; }
    var me = cachedOf('auth.me', {});
    if (me) { S.user = me; S.booting = true; S.cur = { view: 'agenda', params: {} }; render(); openFromHash(); }
    call('app.inicio').then(function (r) {
      store.set('io_c:auth.me:{}', JSON.stringify(r.me));
      store.set('io_c:songs.list:{}', JSON.stringify(r.canciones));
      store.set('io_c:eventos.list:{}', JSON.stringify(r.eventos));
      store.set('io_c:setlists.list:{}', JSON.stringify(r.setlists));
      store.set('io_c:avisos.list:{}', JSON.stringify(r.avisos));
      S.user = r.me; S.songs = r.canciones;
      prefsFromServer(r.prefs);
      S.nov = r.novedades;
      var was = S.booting;
      S.booting = false;
      if (!me) { S.cur = { view: 'agenda', params: {} }; render(); openFromHash(); }
      else if (was && !S.stack.length && !S.guard && ['agenda', 'songs', 'setlists', 'avisos'].indexOf(S.cur.view) >= 0) render();
      setNov(r.novedades);
    }).catch(function (e) {
      S.booting = false;
      if (e && e.error === 'sesion') { clearOfflineData(); setToken(null); S.user = null; render(); return; }
      if (e && e.error === 'red') setOffline(true);
      if (!me) { toast((e && e.message) || 'No se pudo conectar.'); render(); }
    });
  }
  boot();

  // ---------- Instalación (cuando se usa desde el link propio, no desde Apps Script) ----------
  var IS_PWA = !!window.API_URL;
  var installEvt = null;
  function isStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function isMacSafari() { return /Macintosh/.test(navigator.userAgent) && /Safari/.test(navigator.userAgent) && !/Chrome|Chromium|Edg|Firefox/.test(navigator.userAgent) && !isIOS(); }
  function installHint() {
    if (!IS_PWA || isStandalone()) return null;
    if (installEvt) return { text: 'Instalá EnOrden en este dispositivo.', button: true };
    if (isIOS()) return { text: 'Para instalarla: tocá Compartir (el cuadrado con la flecha ↑) y después «Agregar a inicio».' };
    if (isMacSafari()) return { text: 'Para instalarla: en el menú Archivo elegí «Agregar al Dock».' };
    return null;
  }
  function doInstall() {
    if (!installEvt) return;
    installEvt.prompt();
    installEvt.userChoice.then(function () { installEvt = null; drawInstall(); });
  }
  function drawInstall() {
    var box = document.getElementById('install');
    box.textContent = '';
    var h = installHint();
    if (!h || store.get('io_noinstall')) return;
    box.appendChild(el('div', { class: 'install-bar' },
      logoImg(),
      el('div', { class: 'install-text' }, h.text),
      h.button ? el('button', { class: 'btn primary sm', onclick: doInstall }, 'Instalar') : null,
      el('button', { class: 'btn sm', 'aria-label': 'Cerrar', onclick: function () { store.set('io_noinstall', '1'); drawInstall(); } }, h.button ? 'Ahora no' : 'Entendido')));
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; drawInstall(); if (S.cur && S.cur.view === 'account') render(); });
  window.addEventListener('appinstalled', function () { installEvt = null; drawInstall(); toast('EnOrden quedó instalada.'); });
  drawInstall();
  if (IS_PWA && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  window.EnOrden = { installHint: installHint, doInstall: doInstall };
})();
