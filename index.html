<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EnOrden</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#38297b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EnOrden">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Canciones, setlists y agenda del equipo de alabanza de Iglesia Torre Fuerte.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Paleta Iglesia Torre Fuerte: azul marino #38297B, celeste #0B95D4, blanco. En oscuro, sin blanco. */
:root {
  --bg: #f3f5fb; --surface: #ffffff; --surface2: #e9edf7; --text: #1b1838; --muted: #5c5f7c;
  --line: #dce1ee; --accent: #38297b; --accent-text: #ffffff; --chord: #0877b5; --link: #0877b5;
  --danger: #b42318; --ok: #15803d; --radius: 12px; --lyric: 19px;
  --hdr: #38297b; --hdr-text: #ffffff; --hdr-muted: #c9c5ec; --hdr-line: #0b95d4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100d26; --surface: #1b1640; --surface2: #262056; --text: #e3e6f5; --muted: #a2a6c8;
    --line: #322a6a; --accent: #1ea3e2; --accent-text: #0d0a24; --chord: #5cc8f6; --link: #5cc8f6;
    --danger: #ff8a8a; --ok: #5ee0a0; --hdr: #1b1640; --hdr-text: #e3e6f5; --hdr-muted: #a2a6c8; --hdr-line: #322a6a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100d26; --surface: #1b1640; --surface2: #262056; --text: #e3e6f5; --muted: #a2a6c8;
  --line: #322a6a; --accent: #1ea3e2; --accent-text: #0d0a24; --chord: #5cc8f6; --link: #5cc8f6;
  --danger: #ff8a8a; --ok: #5ee0a0; --hdr: #1b1640; --hdr-text: #e3e6f5; --hdr-muted: #a2a6c8; --hdr-line: #322a6a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.2; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* barra de carga */
#bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 50; overflow: hidden; opacity: 0; transition: opacity .2s; }
#bar.on { opacity: 1; }
#bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: var(--accent); animation: slide 1s infinite ease-in-out; }
@keyframes slide { from { left: -40%; } to { left: 100%; } }

/* encabezado */
.top { position: sticky; top: 0; z-index: 10; background: var(--hdr); color: var(--hdr-text); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
html.offline .top-row::after { content: "Sin conexión"; font-size: 12px; background: #b45309; color: #fff; padding: 2px 8px; border-radius: 99px; order: 2; }
.install-bar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 40; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--chord); border-radius: 14px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.25); max-width: 560px; margin: 0 auto; }
.install-bar .logo { width: 40px; height: 40px; }
.install-text { flex: 1; font-size: 14px; }
body:has(.main.live) #install { display: none; }
body:has(.auth) .install-bar { position: static; margin: 0 auto 32px; width: calc(100% - 32px); max-width: 368px; box-shadow: none; }
body:has(.main) .install-bar ~ *, body:has(.install-bar) .main { padding-bottom: 150px; }
body:has(.main .install-bar), body:has(#install .install-bar) #toast { bottom: 120px; }
.top-row { display: flex; align-items: center; gap: 10px; max-width: 820px; margin: 0 auto; padding: 10px 16px 4px; }
.brand { font-weight: 700; flex: 1; letter-spacing: -.01em; order: 1; }
.top-row > .who { order: 3; }
.who { font-size: 14px; color: var(--hdr-text); max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: transparent; border: 1px solid var(--hdr-muted); border-radius: 99px; padding: 5px 12px; cursor: pointer; }
.who.on { border-color: var(--hdr-line); box-shadow: inset 0 0 0 1px var(--hdr-line); }
.top .logo { box-shadow: 0 0 0 2px var(--hdr-line); }
.logo { width: 34px; height: 34px; border-radius: 50%; display: block; flex: none; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--hdr-muted); background: transparent; color: var(--hdr-text); font-size: 22px; line-height: 1; cursor: pointer; flex: none; }
.tabs { display: flex; gap: 4px; max-width: 820px; margin: 0 auto; padding: 0 12px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 9px 9px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.top .tab { color: var(--hdr-muted); }
@media (max-width: 440px) { .top .tab { padding: 10px 6px 9px; font-size: 15px; } .tabs { padding: 0 8px; gap: 0; } }
.top .tab.on { color: var(--hdr-text); border-bottom: 3px solid var(--hdr-line); }

.main { max-width: 820px; margin: 0 auto; padding: 16px 16px 80px; }

/* controles */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; min-height: 40px; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
label.f { display: block; margin-bottom: 12px; }
label.f > span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
input[type=text], input[type=email], input[type=password], input[type=search], input[type=number], input[type=url], select, textarea {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-height: 42px;
}
input:focus, select:focus, textarea:focus, .btn:focus-visible, .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { resize: vertical; }
.editor { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 15px; line-height: 1.5; min-height: 55vh; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.card h3 { font-size: 16px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

/* listas */
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; cursor: pointer; color: inherit; text-decoration: none; }
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--surface2); }
.item.static { cursor: default; }
.item.static:hover { background: none; }
.item-main { flex: 1; min-width: 0; }
.item-title { font-weight: 600; overflow-wrap: anywhere; }
.item-sub { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.key { font-weight: 700; color: var(--chord); background: var(--surface2); border-radius: 8px; padding: 2px 8px; font-size: 14px; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.badge.accent { background: var(--accent); color: var(--accent-text); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.search { margin-bottom: 12px; }

/* canción */
.song-head { margin-bottom: 12px; }
.song-head h2 { font-size: 24px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.meta { color: var(--muted); margin-top: 4px; }
.notes { background: var(--surface2); border-radius: 10px; padding: 10px 12px; margin: 10px 0; white-space: pre-wrap; font-size: 15px; }
.subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0; overflow-x: auto; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; min-height: 38px; font-size: 17px; }
.seg button:hover { background: var(--surface2); }
.seg .val { padding: 0 8px; font-weight: 700; color: var(--chord); min-width: 64px; text-align: center; font-size: 15px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; cursor: pointer; padding: 0 4px; }

.sheet { font-size: var(--lyric); line-height: 1.35; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px; overflow-wrap: anywhere; }
.sheet .ln { white-space: pre-wrap; min-height: 1.35em; }
.sheet .cl { display: flex; flex-wrap: wrap; align-items: flex-end; margin-top: .25em; }
.sheet .sg { display: inline-flex; flex-direction: column; }
.sheet .ch { color: var(--chord); font-weight: 700; font-size: .85em; padding-right: .45em; white-space: pre; line-height: 1.2; }
.sheet .ly { white-space: pre; }
.sheet .only .ly { display: none; }
.sheet .gap { height: .8em; }
.sheet .sec { font-size: .72em; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 1em 0 .2em; }
.sheet .sec:first-child { margin-top: 0; }

.help { font-size: 14px; color: var(--muted); background: var(--surface2); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.help code { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--text); }
.alert { border: 1px solid var(--danger); color: var(--danger); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.success { border: 1px solid var(--ok); border-radius: 10px; padding: 12px; margin-top: 12px; }
.code { font: 700 24px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; color: var(--chord); }

/* login */
.auth { max-width: 400px; margin: 0 auto; padding: 48px 16px; }
.auth-brand { text-align: center; margin-bottom: 24px; }
.auth-brand .logo { width: 112px; height: 112px; margin: 0 auto 14px; }
.auth-brand h1 { font-size: 32px; }
.name { letter-spacing: -.02em; }
.name-b { color: var(--chord); }
.top .name-b { color: var(--hdr-line); }
.verse { margin: 10px auto 0; max-width: 300px; font-style: italic; color: var(--muted); line-height: 1.4; }
.verse cite { display: block; font-style: normal; font-size: 13px; margin-top: 4px; color: var(--chord); letter-spacing: .03em; }
.church { text-align: center; color: var(--muted); font-size: 14px; margin-top: 28px; }
.church .slogan { color: var(--chord); font-weight: 600; margin-top: 2px; }
.account-verse { text-align: center; margin: 28px 0 0; }
.auth-brand h1 { font-size: 26px; letter-spacing: -.02em; }
.auth .tabs { padding: 0; margin-bottom: 16px; border-bottom: 1px solid var(--line); }

/* modal y aviso */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--radius); padding: 18px; width: 100%; max-width: 460px; max-height: 92vh; overflow: auto; }
.modal.wide { max-width: 900px; height: 92vh; display: flex; flex-direction: column; }
.modal.wide iframe, .modal.wide .viewer { flex: 1; width: 100%; border: 0; border-radius: 8px; background: var(--surface2); min-height: 0; }
.modal.wide .viewer { overflow: auto; display: flex; align-items: center; justify-content: center; }
.modal.wide img { max-width: 100%; max-height: 100%; }
.modal p { margin: 0 0 16px; white-space: pre-wrap; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 70; opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100% - 32px); font-size: 15px; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.loading-row { padding: 24px; text-align: center; color: var(--muted); }
.kv { display: grid; grid-template-columns: minmax(9em, 40%) 1fr; gap: 6px 12px; margin: 0 0 10px; font-size: 15px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.meter { height: 10px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin: 4px 0 12px; }
.meter-fill { height: 100%; background: var(--chord); border-radius: 99px; }
.meter.high .meter-fill { background: var(--danger); }
.meter-label { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--surface2); border-radius: 10px; padding: 10px 12px; }
.stat-n { font-size: 24px; font-weight: 700; color: var(--accent); line-height: 1.1; }
:root[data-theme="dark"] .stat-n { color: var(--chord); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat-n { color: var(--chord); } }
.stat-l { font-size: 13px; color: var(--muted); }
.filters { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; margin-bottom: 4px; }
@media (max-width: 600px) { .filters { grid-template-columns: 1fr 1fr; } .filters input { grid-column: 1 / -1; } }
.reg { align-items: flex-start; }
.reg-icon { width: 24px; text-align: center; flex: none; }
.reg-time { font-size: 13px; color: var(--muted); white-space: nowrap; }
a { color: var(--link); }
.section-title { font-size: 15px; margin: 20px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.section-title:first-child { margin-top: 0; }
.grid3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 0 12px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: 1fr 1fr; } .grid3 > :first-child { grid-column: 1 / -1; } }
.datebox { width: 46px; flex: none; text-align: center; border-radius: 10px; background: var(--surface2); padding: 4px 0; color: var(--accent); }
:root[data-theme="dark"] .datebox { color: var(--chord); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .datebox { color: var(--chord); } }
.datebox-d { font-size: 20px; font-weight: 700; line-height: 1.1; }
.datebox-m { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.num { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.item-note { font-size: 14px; color: var(--chord); margin-top: 2px; }
.item.me { background: var(--surface2); }
.list.mine { border-color: var(--chord); }
.team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
@media (max-width: 520px) { .team-grid { grid-template-columns: 1fr; } }
.team-row { display: grid; grid-template-columns: 9.5em 1fr; align-items: center; gap: 8px; font-size: 15px; }
.sl-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; background: var(--bg); }
.aviso-body { white-space: pre-wrap; margin-top: 8px; overflow-wrap: anywhere; }
.aviso.pinned { border-color: var(--chord); }
.main.live { padding-bottom: 110px; max-width: none; }
html.stage .main.live { padding-top: calc(8px + env(safe-area-inset-top)); }
.stage-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.stage-bar .icon-btn { border-color: var(--line); color: var(--text); background: var(--surface); }
.stage-bar .icon-btn.on { border-color: var(--chord); color: var(--chord); }
.stage-title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; border: 0; background: none; text-align: left; cursor: pointer; padding: 0; color: var(--text); }
.stage-count { font-size: 14px; color: var(--muted); flex: none; }
.stage-name { font-size: 22px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage-key { flex: none; font-size: 15px; }
.stage-note { margin: 0 0 10px; }
.stage-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; display: grid; gap: 12px; }
.stage-opt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.stage-opt > .muted { min-width: 9em; }
.pills { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: 15px; min-height: 36px; }
.pill.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.sheet .blk { break-inside: avoid; }
.sheet.mode-chords .cl.only .sg { margin-right: .6em; }
.sheet.mode-chords .ch { font-size: 1em; }
.live .sheet.cols-2 { column-count: 2; column-gap: 40px; column-rule: 1px solid var(--line); }
@media (orientation: landscape) and (min-width: 900px) {
  .live .sheet.cols-auto { column-count: 2; column-gap: 40px; column-rule: 1px solid var(--line); }
}
@media (min-width: 900px) { .main.live { padding-left: 28px; padding-right: 28px; } }
.live-head h2 { font-size: 26px; overflow-wrap: anywhere; }
.live-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 10px; align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); }
.live-nav .btn { min-height: 48px; }
.live-next { flex: 1; text-align: center; font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="app"><div class="loading-row">Cargando…</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="install"></div>
<script src="config.js"></script>

<script>
//<chords>
/* Acordes: lectura, transposición y conversión. Sin dependencias del navegador. */
var Chords = (function () {
  var SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  var FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  var L_SHARP = ['Do', 'Do#', 'Re', 'Re#', 'Mi', 'Fa', 'Fa#', 'Sol', 'Sol#', 'La', 'La#', 'Si'];
  var L_FLAT = ['Do', 'Reb', 'Re', 'Mib', 'Mi', 'Fa', 'Solb', 'Sol', 'Lab', 'La', 'Sib', 'Si'];
  var BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11, DO: 0, RE: 2, MI: 4, FA: 5, SOL: 7, LA: 9, SI: 11 };
  var ROOT = '(?:Do|DO|Re|RE|Mi|MI|Fa|FA|Sol|SOL|La|LA|Si|SI|[A-G])(?:#|b)?';
  var QUAL = '(?:maj|min|m|M|dim|aug|sus|add|º|°|ø|\\+|-|[0-9]|\\(|\\)|#|b)*';
  var CHORD_RE = new RegExp('^(' + ROOT + ')(' + QUAL + ')(?:/(' + ROOT + '))?$');
  var FLAT_MAJOR = { 1: 1, 3: 1, 5: 1, 8: 1, 10: 1 }; // Db Eb F Ab Bb
  var FILLER = /^(\||\/|-+|x\d+|\(x\d+\)|%|\.+)$/i;

  function parse(s) {
    var m = CHORD_RE.exec(String(s || '').trim());
    return m ? { root: m[1], qual: m[2], bass: m[3] || '' } : null;
  }
  function isChord(s) { return !!parse(s); }
  function mod(n) { return ((n % 12) + 12) % 12; }
  function noteIdx(root) {
    var base = root.replace(/[#b]$/, '');
    var acc = root.slice(base.length);
    return mod(BASE[base.toUpperCase()] + (acc === '#' ? 1 : acc === 'b' ? -1 : 0));
  }
  function styleOf(root) {
    var b = root.replace(/[#b]$/, '');
    if (b.length === 1) return 'en';
    return b === b.toUpperCase() ? 'LATIN' : 'latin';
  }
  function name(idx, flat, style) {
    idx = mod(idx);
    if (style === 'en') return (flat ? FLAT : SHARP)[idx];
    var n = (flat ? L_FLAT : L_SHARP)[idx];
    if (style === 'LATIN') { var b = n.replace(/[#b]$/, ''); return b.toUpperCase() + n.slice(b.length); }
    return n;
  }
  function isMinor(qual) { return /^(m(?!aj)|min|-)/.test(qual); }
  function prefersFlat(idx, minor) { return !!FLAT_MAJOR[mod(minor ? idx + 3 : idx)]; }

  function transposeChord(ch, semis, flat) {

    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 3800);
  }
  function showErr(e) { toast((e && e.message) || 'Ocurrió un error.'); }

  function modal(content, wide) {
    var box = el('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true' }, content);
    var bg = el('div', { class: 'modal-bg' }, box);
    function close() { if (bg.parentNode) bg.parentNode.removeChild(bg); document.removeEventListener('keydown', onKey); }
    function onKey(ev) { if (ev.key === 'Escape') close(); }
    bg.addEventListener('click', function (ev) { if (ev.target === bg) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(bg);
    return close;
  }
  function ask(msg, okLabel, danger) {
    return new Promise(function (resolve) {
      var close;
      var ok = el('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), onclick: function () { close(); resolve(true); } }, okLabel || 'Aceptar');
      close = modal([
        el('p', null, msg),
        el('div', { class: 'row' }, el('span', { class: 'spacer' }),
          el('button', { class: 'btn', onclick: function () { close(); resolve(false); } }, 'Cancelar'), ok),
      ]);
      ok.focus();
    });
  }

  function copyText(text, okMsg) {
    function fallback() {
      var ta = el('textarea', { value: text, readonly: true, style: 'position:fixed;top:0;left:0;opacity:0' });
      document.body.appendChild(ta);
      ta.select();
      var done = false;
      try { done = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (done) { toast(okMsg || 'Copiado.'); return; }
      var area = el('textarea', { value: text, rows: 10, readonly: true });
      var close = modal([el('p', null, 'Seleccioná el texto y copialo:'), area,
        el('div', { class: 'row', style: 'margin-top:12px' }, el('span', { class: 'spacer' }),
          el('button', { class: 'btn primary', onclick: function () { close(); } }, 'Listo'))]);
      area.focus(); area.select();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg || 'Copiado.'); }, fallback);
    } else fallback();
  }

  // ---------- API ----------
  function setBusy(d) {
    S.pending = Math.max(0, S.pending + d);
    document.getElementById('bar').classList.toggle('on', S.pending > 0);
  }
  function call(action, payload) {
    var body = JSON.stringify({ action: action, token: S.token, payload: payload || {} });
    setBusy(1);
    var p;
    if (window.google && google.script && google.script.run) {
      p = new Promise(function (res, rej) {
        google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(body);
      }).then(function (s) { return JSON.parse(s); });
    } else if (!/^https?:\/\//.test(window.API_URL || '')) {
      p = Promise.resolve({ ok: false, error: 'config', message: 'Falta configurar la dirección del servidor en config.js.' });
    } else {
      p = fetch(window.API_URL, { method: 'POST', body: body }).then(function (r) { return r.json(); });
    }
    var key = OFFLINE_READS[action] ? 'io_c:' + action + ':' + JSON.stringify(payload || {}) : null;
    return p.catch(function () {
      return { ok: false, error: 'red', message: 'Sin conexión. Revisá tu internet e intentá de nuevo.' };
    }).then(function (r) {
      setBusy(-1);
      if (r.ok) {
        setOffline(false);
        if (key) store.set(key, JSON.stringify(r.data));
        return r.data;
      }
      if (r.error === 'red' && key) {
        var saved = store.get(key);
        if (saved) { setOffline(true); return JSON.parse(saved); }
      }
      if (r.error === 'sesion' && action.indexOf('auth.') !== 0) { endSession(); }
      throw r;
    });
  }
  // Lo que se puede ver sin conexión (lo último que se cargó en este dispositivo)
  var OFFLINE_READS = { 'auth.me': 1, 'songs.list': 1, 'songs.get': 1, 'setlists.list': 1, 'setlists.get': 1, 'eventos.list': 1, 'avisos.list': 1 };
  function setOffline(on) {
    if (S.offline === on) return;
    S.offline = on;
    document.documentElement.classList.toggle('offline', on);
    if (on) toast('Sin conexión: estás viendo lo último guardado en este dispositivo.');
  }
  function clearOfflineData() {
    try {
      Object.keys(localStorage).forEach(function (k) { if (k.indexOf('io_c:') === 0) localStorage.removeItem(k); });
    } catch (e) {}
  }
  function endSession() { clearOfflineData(); setToken(null); S.user = null; S.songs = null; S.cache = {}; S.setlistCache = {}; S.stack = []; S.guard = null; render(); }

  // ---------- Navegación ----------
  var GROUP = {
    agenda: 'agenda', evento: 'agenda', eventoForm: 'agenda',
    setlists: 'setlists', setlist: 'setlists', setlistForm: 'setlists', live: 'setlists',
    songs: 'songs', song: 'songs', songEdit: 'songs', songForm: 'songs', version: 'songs',
    avisos: 'avisos', users: 'users', account: 'account', sistema: 'sistema', registro: 'registro',
  };
  function leave(fn) {
    var msg = S.guard && S.guard();
    if (!msg) { S.guard = null; fn(); return; }
    ask(msg, 'Salir sin guardar', true).then(function (ok) { if (ok) { S.guard = null; fn(); } });
  }
  function go(view, params) { leave(function () { if (S.cur) S.stack.push(S.cur); S.cur = { view: view, params: params || {} }; render(); }); }
  function nav(view, params) { leave(function () { S.stack = []; S.cur = { view: view, params: params || {} }; render(); }); }
  function back() { leave(function () { S.cur = S.stack.pop() || { view: 'agenda', params: {} }; render(); }); }
  function replace(view, params) { S.guard = null; S.cur = { view: view, params: params || {} }; render(); }

  function render() {
    var app = document.getElementById('app');
    app.textContent = '';
    var rid = ++S.rid;
    S.guard = null;
    if (!S.user) { app.appendChild(viewLogin()); return; }
    if (!S.cur) S.cur = { view: 'agenda', params: {} };
    var stage = S.cur.view === 'live';
    document.documentElement.classList.toggle('stage', stage);
    if (!stage) { wakeOff(); exitFull(); }
    if (!stage) app.appendChild(header());
    var main = el('main', { class: 'main' });
    app.appendChild(main);
    var v = VIEWS[S.cur.view] || VIEWS.agenda;
    v(main, S.cur.params, function () { return rid === S.rid; });
    window.scrollTo(0, 0);
    var on = app.querySelector('.top .tab.on');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  }

  // ---------- Login y registro ----------
  function viewLogin() {
    var mode = S.loginMode;
    var email = el('input', { type: 'email', autocomplete: 'email', required: true, value: S.loginEmail || '' });
    var pass = el('input', { type: 'password', autocomplete: mode === 'login' ? 'current-password' : 'new-password', required: true });
    var code = el('input', { type: 'text', autocomplete: 'off', placeholder: 'XXXX-XXXX', required: true, style: 'text-transform:uppercase' });
    var nombre = el('input', { type: 'text', autocomplete: 'name', required: true, maxlength: 60 });
    var pass2 = el('input', { type: 'password', autocomplete: 'new-password', required: true });
    var err = el('div');
    var submit = el('button', { class: 'btn primary', type: 'submit', style: 'width:100%' }, mode === 'login' ? 'Ingresar' : 'Crear mi usuario');

    function sw(m) { S.loginEmail = email.value; S.loginMode = m; render(); }
    var form = el('form', { class: 'card', onsubmit: function (ev) {
      ev.preventDefault();
      err.textContent = '';
      var req;
      if (mode === 'login') {

      } else {
        if (pass.value !== pass2.value) { err.appendChild(el('div', { class: 'alert' }, 'Las contraseñas no coinciden.')); return; }
        req = call('auth.register', { email: email.value, codigo: code.value, nombre: nombre.value, password: pass.value });
      }
      submit.disabled = true;
      req.then(function (r) {
        setToken(r.token); S.user = r.usuario; S.loginMode = 'login'; S.stack = []; S.cur = { view: 'agenda', params: {} };
        render();
        if (mode !== 'login') toast('¡Bienvenido/a, ' + r.usuario.nombre + '!');
      }).catch(function (e) {
        submit.disabled = false;
        err.appendChild(el('div', { class: 'alert' }, e.message || 'No se pudo ingresar.'));
      });
    } },
      el('div', { class: 'tabs' },
        el('button', { type: 'button', class: 'tab' + (mode === 'login' ? ' on' : ''), onclick: function () { sw('login'); } }, 'Ingresar'),
        el('button', { type: 'button', class: 'tab' + (mode === 'reg' ? ' on' : ''), onclick: function () { sw('reg'); } }, 'Tengo un código')),
      mode === 'reg' ? el('p', { class: 'muted small', style: 'margin-top:0' }, 'Usá el mail al que te llegó la invitación y el código que te enviaron.') : null,
      field('Mail', email),
      mode === 'reg' ? field('Código de invitación', code) : null,
      mode === 'reg' ? field('Tu nombre', nombre) : null,
      field(mode === 'login' ? 'Contraseña' : 'Elegí una contraseña (mínimo 8 caracteres)', pass),

    return el('div', { class: 'auth' },
      el('div', { class: 'auth-brand' },
        logoImg(),
        el('h1', null, brandName()),
        verse()),
      form,
      mode === 'login' ? el('p', { class: 'muted small', style: 'text-align:center' }, '¿Te olvidaste la contraseña? Pedile a un administrador una nueva invitación.') : null,
      el('div', { class: 'church' },
        el('div', null, 'Iglesia Torre Fuerte · Equipo de alabanza'),
        el('div', { class: 'slogan' }, 'Dios pensó en un lugar para vos')));
  }

  var VIEWS = {};

  // ---------- Canciones ----------
  VIEWS.songs = function (main, p, alive) {
    var q = el('input', { type: 'search', class: 'search', placeholder: 'Buscar por título o autor', value: S.songQuery || '', 'aria-label': 'Buscar canciones' });
    var list = el('div');
    main.appendChild(el('div', { class: 'row', style: 'margin-bottom:12px' },
      el('h2', { style: 'font-size:22px' }, 'Canciones'), el('span', { class: 'spacer' }),
      isAdmin() ? el('button', { class: 'btn primary', onclick: function () { go('songForm', {}); } }, '+ Nueva canción') : null));
    main.appendChild(q);
    main.appendChild(list);

    function draw() {
      list.textContent = '';
      var term = norm(q.value);
      var roots = S.songs.filter(function (s) { return !s.origen_id; });
      var rows = roots.filter(function (s) { return !term || norm(s.titulo + ' ' + s.autor).indexOf(term) >= 0; });
      if (!roots.length) {
        list.appendChild(el('div', { class: 'list' }, el('div', { class: 'empty' },
          'Todavía no hay canciones.', isAdmin() ? el('div', null, 'Tocá «+ Nueva canción» para cargar la primera.') : null)));
        return;
      }
      if (!rows.length) { list.appendChild(el('div', { class: 'list' }, el('div', { class: 'empty' }, 'No hay canciones que coincidan.'))); return; }
      list.appendChild(el('div', { class: 'list' }, rows.map(function (s) {
        return el('button', { class: 'item', onclick: function () { go('song', { id: s.id }); } },
          el('div', { class: 'item-main' },

            s.autor ? el('div', { class: 'item-sub' }, s.autor) : null),
          s.tono ? el('span', { class: 'key' }, s.tono) : null);
      })));
      list.appendChild(el('p', { class: 'muted small' }, rows.length + (rows.length === 1 ? ' canción' : ' canciones')));
    }
    q.addEventListener('input', function () { S.songQuery = q.value; draw(); });
    if (S.songs) draw(); else list.appendChild(loadingRow());
    call('songs.list').then(function (r) { S.songs = r; if (alive()) draw(); }).catch(showErr);
  };

  VIEWS.song = function (main, p, alive) {
    var cached = S.cache[p.id];
    if (cached) drawSong(main, cached, p); else main.appendChild(loadingRow());
    call('songs.get', { id: p.id }).then(function (d) {
      S.cache[p.id] = d;
      if (!alive()) return;

    }).catch(function (e) { showErr(e); if (e.error === 'no_existe' && alive()) back(); });

  function drawSong(main, d, p) {

    p.offset = p.offset || 0;

        el('a', { href: '#', onclick: function (e) { e.preventDefault(); go('song', { id: d.original.id }); } }, 'la original' + (d.original.tono ? ' (' + d.original.tono + ')' : '')),
        '. Si cambian la letra de la original, esta copia no se actualiza sola.',

        el('button', { class: 'btn', onclick: function () { go('songForm', { id: song.id }); } }, 'Editar datos'),
        isSuper() ? el('button', { class: 'btn danger', onclick: function () { archive(song); } }, song.archivada === 'si' ? 'Desarchivar' : 'Archivar') : null) : null));

    var tabs = el('div', { class: 'subtabs' });

    main.appendChild(body);

    function setTab(t) { p.tab = t; draw(); }
    function draw() {
      tabs.textContent = '';

        tabs.appendChild(el('button', { class: 'tab' + (p.tab === t[0] ? ' on' : ''), onclick: function () { setTab(t[0]); } }, t[1]));
      });
      body.textContent = '';
      if (p.tab === 'letra') drawLyricsTab(body, d, p, draw);
      else if (p.tab === 'versiones') drawVersionsTab(body, d);
      else drawFilesTab(body, d);

    draw();
  }

  function drawLyricsTab(body, d, p, redraw) {
    var song = d.cancion;
    var baseKey = song.tono || Chords.detectKey(d.texto);
    var tk = baseKey ? Chords.targetKey(baseKey, p.offset) : null;
    var flat = tk ? tk.flat : false;
    var off = ((p.offset % 12) + 12) % 12;
    var label = tk ? tk.name : (off ? (p.offset > 0 ? '+' : '') + p.offset : 'Original');

        el('button', { onclick: function () { shift(1); }, 'aria-label': 'Subir medio tono' }, '+')),

  function saveTransposed(d, p, tk, flat) {
    var song = d.cancion;
    var from = song.tono || Chords.detectKey(d.texto) || '';
    ask('Se va a guardar una versión nueva de la letra en ' + tk.name + '. Las versiones anteriores quedan guardadas.', 'Guardar').then(function (ok) {
      if (!ok) return;
      call('songs.saveText', {
        id: song.id, base_version: song.version_actual,
        texto: Chords.transposeText(d.texto, p.offset, flat),
        comentario: 'Transpuesta' + (from ? ' de ' + from : '') + ' a ' + tk.name,
      }).then(function (v) {
        var next = song.tono ? call('songs.update', { id: song.id, tono: tk.name }) : Promise.resolve();
        return next.then(function () {
          toast('Guardada como versión ' + v.numero + '.');
          S.songs = null; delete S.cache[song.id];
          replace('song', { id: song.id });
        });
      }).catch(showErr);
    });
  }

  function syncCopy(d) {
    var song = d.cancion;
    ask('Se va a reemplazar la letra de esta copia por la de la original, pasada a ' + song.tono + '. Queda guardada como una versión nueva.', 'Actualizar').then(function (ok) {
      if (!ok) return;
      call('songs.get', { id: d.original.id }).then(function (o) {
        var semis = Chords.semitones(o.cancion.tono || Chords.detectKey(o.texto), song.tono);
        var tk = Chords.targetKey(song.tono, 0);
        var texto = Chords.transposeText(o.texto, semis, tk ? tk.flat : false);
        if (texto === d.texto) { toast('La copia ya está igual a la original.'); return; }
        return call('songs.saveText', { id: song.id, base_version: song.version_actual, texto: texto, comentario: 'Actualizada desde la original' })
          .then(function (v) { toast('Copia actualizada (versión ' + v.numero + ').'); refreshSong(song.id, 'letra'); });
      }).catch(showErr);
    });
  }

  /**
   * Dibuja la letra. opts.mode: 'full' (letra y acordes), 'lyrics' (solo letra), 'chords' (solo acordes).
   * Agrupa en bloques (por sección o estrofa) para que las columnas no corten una estrofa al medio.
   */
  function renderLyrics(text, semis, flat, opts) {
    opts = opts || {};
    var mode = opts.mode || (prefs.chords ? 'full' : 'lyrics');
    if (!String(text || '').trim()) return el('div', { class: 'sheet muted' }, 'Esta canción todavía no tiene letra.');
    var box = el('div', { class: 'sheet mode-' + mode });
    box.style.setProperty('--lyric', (opts.size || prefs.size) + 'px');
    var blk = null;
    function block() { if (!blk) { blk = el('div', { class: 'blk' }); box.appendChild(blk); } return blk; }
    String(text).replace(/\r/g, '').split('\n').forEach(function (line) {
      var pl = Chords.parseLine(line);
      if (pl.type === 'section') { blk = null; block().appendChild(el('div', { class: 'sec' }, pl.text)); return; }
      if (pl.type === 'text') {
        if (!line.trim()) { if (blk) { blk.appendChild(el('div', { class: 'gap' })); blk = null; } return; }
        if (mode !== 'chords') block().appendChild(el('div', { class: 'ln' }, line));
        return;
      }
      var chordOnly = pl.segs.every(function (s) { return !s.text.trim(); });
      if (mode === 'lyrics') {
        if (!chordOnly) block().appendChild(el('div', { class: 'ln' }, pl.segs.map(function (s) { return s.text; }).join('')));
        return;
      }
      if (mode === 'chords') {
        var only = pl.segs.filter(function (s) { return s.chord !== null; });
        if (only.length) block().appendChild(el('div', { class: 'cl only' }, only.map(function (s) {
          return el('span', { class: 'sg' }, el('b', { class: 'ch' }, Chords.transposeChord(s.chord, semis, flat)));
        })));
        return;
      }
      var row = el('div', { class: 'cl' + (chordOnly ? ' only' : '') });
      pl.segs.forEach(function (s) {
        var parts = s.text.match(/\S+\s*|\s+/g) || [''];
        // Si el acorde cae sobre un espacio, lo pegamos a la palabra siguiente

  VIEWS.live = function (main, p, alive) {

        main.textContent = '';

        function go2(n) { replace('live', { id: p.id, i: n, panel: p.panel }); }
        function redraw() { replace('live', p); }

        var song = d.cancion;
        var key = song.tono || Chords.detectKey(d.texto);
        var capo = getCapo(song.id);
        var tk = key && capo ? Chords.targetKey(key, -capo) : null;
        var keyLabel = capo ? 'Capo ' + capo + (tk ? ' · ' + tk.name : '') : (key || '');

        // Barra superior compacta

          el('button', { class: 'icon-btn' + (p.panel ? ' on' : ''), 'aria-label': 'Ajustes', 'aria-expanded': p.panel ? 'true' : 'false',
            onclick: function () { p.panel = !p.panel; redraw(); } }, '⚙')));

        if (p.panel) main.appendChild(stagePanel(song, key, capo, redraw));
        if (it.notas) main.appendChild(el('div', { class: 'notes stage-note' }, it.notas));

        var sheet = renderLyrics(d.texto, -capo, tk ? tk.flat : false, { mode: stagePrefs.mode, size: stagePrefs.size });
        sheet.classList.add('cols-' + stagePrefs.cols);
        main.appendChild(sheet);

        main.appendChild(el('nav', { class: 'live-nav' },
          el('button', { class: 'btn', disabled: i === 0, onclick: function () { go2(i - 1); } }, '‹ Anterior'),
          el('div', { class: 'live-next' }, next ? 'Sigue: ' + next.titulo : 'Última canción'),
          el('button', { class: 'btn primary', disabled: !next, onclick: function () { go2(i + 1); } }, 'Siguiente ›')));

        // Deslizar a los costados para cambiar de canción
        var x0 = null, y0 = 0;
        sheet.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
        sheet.addEventListener('touchend', function (e) {
          if (x0 === null) return;
          var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
          x0 = null;
          if (Math.abs(dx) < 80 || Math.abs(dy) > 60) return;
          if (dx < 0 && next) go2(i + 1);

    }).catch(showErr);

      case 'cancion.desarchivar': return 'volvió a mostrar ' + q(d);
      case 'adjunto.subir': m = /^(.*?): (.*)$/.exec(d); return m ? 'subió ' + q(m[2]) + ' a ' + q(m[1]) : 'subió un archivo: ' + d;
      case 'adjunto.link': m = /^(.*?): (.*)$/.exec(d); return m ? 'agregó un link a ' + q(m[1]) : 'agregó un link: ' + d;
      case 'adjunto.quitar': return 'quitó el archivo ' + q(d);
      case 'setlist.crear': return 'creó el setlist ' + q(d);
      case 'setlist.editar': return 'editó el setlist ' + q(d);
      case 'setlist.borrar': return 'borró el setlist ' + q(d);
      case 'evento.crear': case 'evento.editar': case 'evento.borrar':
        m = /^(.*) (\d{4}-\d{2}-\d{2}T[\d:.]+Z?)$/.exec(r.detalle || '');
        return { crear: 'creó', editar: 'editó', borrar: 'borró' }[r.accion.split('.')[1]] + ' el evento ' +
          (m ? q(m[1]) + ' del ' + fmtDay(m[2], false).toLowerCase() + ' ' + fmtTime(m[2]) : d);
      case 'aviso.crear': return 'publicó el aviso ' + q(d);
      case 'aviso.editar': return 'editó el aviso ' + q(d);
      case 'aviso.borrar': return 'borró el aviso ' + q(d);
      case 'invitacion.crear': m = /^(.*) \((\w+)\)$/.exec(d); return m ? 'invitó a ' + m[1] + ' como ' + (ROLE_NAME[m[2]] || m[2]).toLowerCase() : 'invitó a ' + d;
      case 'invitacion.cancelar': return 'canceló la invitación de ' + d;
      case 'usuario.registro': m = /^(.*) \((\w+)\)$/.exec(d); return 'creó su usuario' + (m ? ' (' + (ROLE_NAME[m[2]] || m[2]).toLowerCase() + ')' : '');
      case 'usuario.rol': return 'cambió el rol de ' + d.replace(/\b(super|admin|lectura)\b/g, function (x) { return ROLE_NAME[x].toLowerCase(); });
      case 'usuario.baja': return 'dio de baja a ' + d;
      case 'usuario.reactivar': return 'reactivó a ' + d;
      case 'usuario.clave': return 'cambió su contraseña';
      case 'usuario.nombre': return 'cambió su nombre (' + d + ')';
      case 'sistema.respaldo': return 'hizo un respaldo manual';
      default: return r.accion + (d ? ': ' + d : '');
    }
  }
  function dayLabel(iso) {
    var d = new Date(iso), t = new Date();
    var key = localDate(iso), today = localDate(t.toISOString()), yest = localDate(new Date(Date.now() - 86400000).toISOString());
    if (key === today) return 'Hoy';
    if (key === yest) return 'Ayer';
    return cap(d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: d.getFullYear() !== t.getFullYear() ? 'numeric' : undefined }));
  }

  VIEWS.registro = function (main, p, alive) {
    var tipo = el('select', { 'aria-label': 'Tipo de actividad' },
      [['', 'Todo'], ['canciones', 'Canciones'], ['setlists', 'Setlists'], ['agenda', 'Agenda'], ['avisos', 'Avisos'], ['usuarios', 'Usuarios'], ['sistema', 'Sistema']]
        .map(function (o) { return el('option', { value: o[0] }, o[1]); }));
    var persona = el('select', { 'aria-label': 'Persona' }, el('option', { value: '' }, 'Todas las personas'));
    var buscar = el('input', { type: 'search', placeholder: 'Buscar (canción, evento, mail…)', 'aria-label': 'Buscar en el registro' });
    var list = el('div', null, loadingRow());
    var more = el('div');
    var items = [], total = 0, timer = null;
    tipo.value = p.tipo || ''; buscar.value = p.q || '';

    main.appendChild(el('h2', { style: 'font-size:22px;margin-bottom:14px' }, 'Registro de actividad'));
    main.appendChild(el('div', { class: 'filters' }, tipo, persona, buscar));
    main.appendChild(list);
    main.appendChild(more);

    function filters() { return { tipo: tipo.value, usuario_id: persona.value, q: buscar.value.trim() }; }
    function load(append) {
      var f = filters();
      p.tipo = f.tipo; p.persona = f.usuario_id; p.q = f.q;
      if (!append) { items = []; list.textContent = ''; list.appendChild(loadingRow()); }
      call('registro.list', Object.assign({ offset: items.length, limit: 100 }, f)).then(function (r) {
        if (!alive()) return;
        items = items.concat(r.items); total = r.total;
        draw();
      }).catch(showErr);
    }
    function draw() {
      list.textContent = '';
      more.textContent = '';
      if (!items.length) { list.appendChild(el('div', { class: 'list' }, el('div', { class: 'empty' }, 'No hay actividad que coincida.'))); return; }
      var lastDay = null, group = null;
      items.forEach(function (r) {
        var day = dayLabel(r.fecha);
        if (day !== lastDay) {
          lastDay = day;
          list.appendChild(el('h3', { class: 'section-title' }, day));
          group = el('div', { class: 'list' });
          list.appendChild(group);
        }
        var kind = r.accion.split('.')[0];
        group.appendChild(el('div', { class: 'item static reg' },
          el('span', { class: 'reg-icon', 'aria-hidden': 'true' }, REG_ICON[kind] || '•'),
          el('div', { class: 'item-main' },
            el('div', null, el('strong', null, r.usuario_nombre || 'Sistema'), ' ', regSentence(r))),
          el('span', { class: 'reg-time' }, fmtTime(r.fecha))));
      });
      more.appendChild(el('p', { class: 'muted small', style: 'text-align:center' }, 'Mostrando ' + items.length + ' de ' + total +
        ' · Se guardan los últimos 3 meses; lo anterior queda en la planilla «EnOrden — registro anterior» del Drive.'));
      if (items.length < total) more.appendChild(el('div', { style: 'text-align:center' },
        el('button', { class: 'btn', onclick: function () { load(true); } }, 'Cargar más')));
    }
    tipo.addEventListener('change', function () { load(false); });
    persona.addEventListener('change', function () { load(false); });
    buscar.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { load(false); }, 400); });

    call('users.list', { incluirInactivos: true }).then(function (us) {
      us.forEach(function (u) { persona.appendChild(el('option', { value: u.id }, u.nombre + (u.activo === 'si' ? '' : ' (baja)'))); });
      persona.value = p.persona || '';
    }).catch(function () {}).then(function () { if (alive()) load(false); });
  };

  // ---------- Mi cuenta ----------
  VIEWS.account = function (main) {
    var nombre = el('input', { type: 'text', required: true, maxlength: 60, value: S.user.nombre });
    var actual = el('input', { type: 'password', required: true, autocomplete: 'current-password' });
    var nueva = el('input', { type: 'password', required: true, autocomplete: 'new-password' });
    var nueva2 = el('input', { type: 'password', required: true, autocomplete: 'new-password' });
    var theme = el('select', { onchange: function () { prefs.theme = theme.value; store.set('io_theme', prefs.theme); applyTheme(); } },
      el('option', { value: 'auto' }, 'Automático (según el dispositivo)'),
      el('option', { value: 'light' }, 'Claro'),
      el('option', { value: 'dark' }, 'Oscuro'));
    theme.value = prefs.theme;

    main.appendChild(el('div', { class: 'card' },
      el('h3', null, S.user.nombre),
      el('div', { class: 'muted' }, S.user.email),
      el('div', { style: 'margin-top:8px' }, el('span', { class: 'badge accent' }, ROLE_NAME[S.user.rol]))));

    main.appendChild(el('form', { class: 'card', onsubmit: function (ev) {
      ev.preventDefault();
      call('auth.updateMe', { nombre: nombre.value }).then(function (u) { S.user = u; toast('Nombre actualizado.'); render(); }).catch(showErr);
    } }, el('h3', null, 'Tu nombre'), el('p', { class: 'muted small', style: 'margin-top:0' }, 'Es el que aparece en el historial de versiones.'),
      field('Nombre', nombre), el('button', { class: 'btn', type: 'submit' }, 'Guardar nombre')));

    main.appendChild(el('form', { class: 'card', onsubmit: function (ev) {
      ev.preventDefault();
      if (nueva.value !== nueva2.value) { toast('Las contraseñas nuevas no coinciden.'); return; }
      call('auth.updateMe', { password_actual: actual.value, password_nuevo: nueva.value }).then(function () {
        actual.value = nueva.value = nueva2.value = '';
        toast('Contraseña cambiada.');
      }).catch(showErr);
    } }, el('h3', null, 'Cambiar contraseña'),
      field('Contraseña actual', actual), field('Nueva (mínimo 8 caracteres)', nueva), field('Repetir la nueva', nueva2),
      el('button', { class: 'btn', type: 'submit' }, 'Cambiar contraseña')));

    main.appendChild(el('div', { class: 'card' }, el('h3', null, 'Apariencia'), field('Tema', theme)));
    var hint = window.EnOrden && window.EnOrden.installHint();
    if (hint) {
      main.appendChild(el('div', { class: 'card' }, el('h3', null, 'Instalar en este dispositivo'),
        el('p', { class: 'muted', style: 'margin-top:0' }, hint.text),
        hint.button ? el('button', { class: 'btn primary', onclick: function () { window.EnOrden.doInstall(); } }, 'Instalar EnOrden') : null));
    }

    main.appendChild(el('button', { class: 'btn danger', onclick: function () {
      call('auth.logout').catch(function () {}).then(endSession);
    } }, 'Cerrar sesión'));
    main.appendChild(el('div', { class: 'account-verse' }, verse(), el('p', { class: 'muted small' }, 'EnOrden ' + APP_VERSION)));
  };

  // ---------- Inicio ----------
  applyTheme();
  if (!S.token) render();
  else call('auth.me').then(function (u) { S.user = u; S.cur = { view: 'agenda', params: {} }; render(); })
    .catch(function (e) {
      if (e && e.error === 'sesion') { clearOfflineData(); setToken(null); }
      else toast((e && e.message) || 'No se pudo conectar.');
      render();
    });

  // ---------- Instalación (cuando se usa desde el link propio, no desde Apps Script) ----------
  var IS_PWA = !!window.API_URL;
  var installEvt = null;
  function isStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function isMacSafari() { return /Macintosh/.test(navigator.userAgent) && /Safari/.test(navigator.userAgent) && !/Chrome|Chromium|Edg|Firefox/.test(navigator.userAgent) && !isIOS(); }
  function installHint() {
    if (!IS_PWA || isStandalone()) return null;
    if (installEvt) return { text: 'Instalá EnOrden en este dispositivo.', button: true };
    if (isIOS()) return { text: 'Para instalarla: tocá Compartir (el cuadrado con la flecha ↑) y después «Agregar a inicio».' };
    if (isMacSafari()) return { text: 'Para instalarla: en el menú Archivo elegí «Agregar al Dock».' };
    return null;
  }
  function doInstall() {
    if (!installEvt) return;
    installEvt.prompt();
    installEvt.userChoice.then(function () { installEvt = null; drawInstall(); });
  }
  function drawInstall() {
    var box = document.getElementById('install');
    box.textContent = '';
    var h = installHint();
    if (!h || store.get('io_noinstall')) return;
    box.appendChild(el('div', { class: 'install-bar' },
      logoImg(),
      el('div', { class: 'install-text' }, h.text),
      h.button ? el('button', { class: 'btn primary sm', onclick: doInstall }, 'Instalar') : null,
      el('button', { class: 'btn sm', 'aria-label': 'Cerrar', onclick: function () { store.set('io_noinstall', '1'); drawInstall(); } }, h.button ? 'Ahora no' : 'Entendido')));
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; drawInstall(); if (S.cur && S.cur.view === 'account') render(); });
  window.addEventListener('appinstalled', function () { installEvt = null; drawInstall(); toast('EnOrden quedó instalada.'); });
  drawInstall();
  if (IS_PWA && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  window.EnOrden = { installHint: installHint, doInstall: doInstall };
})();
</script>
